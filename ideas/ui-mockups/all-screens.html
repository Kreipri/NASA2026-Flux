  <path d="M0,430 L0,404 L120,396 L240,410 L380,392 L520,406 L700,398 L900,410 L1100,396 L1280,404 L1280,430Z" fill="#252c40"/>
  <path d="M0,720 L0,440 C200,436 420,446 640,432 C700,440 740,470 780,540 C820,610 860,640 940,646 L1120,646 C1180,620 1240,560 1280,530 L1280,720Z" fill="url(#${P}soil)"/>

  <text x="700" y="420" font-family="Nunito" font-weight="800" font-size="17" fill="#ffd896">sunlight skims over the rim</text>
  ${baseArt(380,440,1.25,false)}
  <g fill="#bfe6ff">${[[960,660,3],[1000,672,2.5],[1040,664,3.5],[1080,676,2.5],[1010,690,2],[1100,662,2]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g>
  <g transform="translate(1020 590)"><path d="M0,-22 v44 M-19,-11 l38,22 M-19,11 l38,-22" stroke="#bfe6ff" stroke-width="4" stroke-linecap="round"/></g>

function sceneStorm(P){const R=SR(9);let streams='';for(let i=0;i<9;i++){const y0=250+i*28,c=R()*60;streams+=`<path class="flow" style="animation-delay:${(i*.3).toFixed(1)}s" d="M250,${y0} C500,${y0-60+c} 760,${y0+40-c} 1010,${430+i*10}" stroke="#ffb347" stroke-width="${2+R()*2}" stroke-dasharray="3 14" stroke-linecap="round" fill="none" opacity=".85"/>`}
  return `<svg viewBox="0 0 1280 720" width="1280" height="720"><defs>${skyDefs(P,'#03050f','#0e1530')}</defs><rect width="1280" height="720" fill="url(#${P}sky)"/>${svgStars(120,720,21)}
  <circle cx="90" cy="360" r="300" fill="#ffb347" opacity=".07"/><circle cx="90" cy="360" r="200" fill="#ffc86b" opacity=".14"/><circle cx="90" cy="360" r="150" fill="#ffd27a"/>
  <path d="M210,270 q60,-50 40,20" stroke="#ffe6a8" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M225,420 q70,10 20,50" stroke="#ffe6a8" stroke-width="6" fill="none" stroke-linecap="round"/>
  ${streams}
  <path d="M760,720 C860,560 1100,470 1300,450 L1300,720Z" fill="#8f939e"/><path d="M760,720 C860,560 1100,470 1300,450" stroke="#babdc6" stroke-width="6" fill="none"/>
  ${baseArt(1080,512,.8,false)}
  <path d="M1004,476 a40,22 0 0 1 80,0Z" fill="#5ee0e8" opacity=".28"/>
  ${earthArt(P,1150,140,48,false)}
  ${[0,1,2].map(i=>`<path d="M${1125-i*18},${200+i*16} q-20,${40+i*10} -${20+i*10},${80+i*18}" stroke="#5ee0e8" stroke-width="3" fill="none" opacity="${.9-i*.25}" stroke-dasharray="5 7"/>`).join('')}
  <rect x="1040" y="232" width="200" height="30" rx="15" fill="#0b2030" stroke="#5ee0e8"/><text x="1140" y="252" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="14" fill="#cfefff">Mission Control: “take cover”</text></svg>`}
function sceneGoal(P){return `<svg viewBox="0 0 1280 720" width="1280" height="720"><defs>${skyDefs(P)}<radialGradient id="${P}pool"><stop offset="0" stop-color="#ffb06a" stop-opacity=".35"/><stop offset="1" stop-color="#ffb06a" stop-opacity="0"/></radialGradient></defs>
  <rect width="1280" height="720" fill="url(#${P}sky)"/>${svgStars(110,420,5)}${sunArt(110,436,28)}${earthArt(P,1100,130,40)}
  <path d="M-20,520 L-20,446 L120,438 L260,452 L420,430 L600,448 L780,424 L960,446 L1140,430 L1300,440 L1300,520Z" fill="#252c40"/>
  <path d="M-20,720 L-20,500 C300,488 900,488 1300,500 L1300,720Z" fill="#a7aab2"/><path d="M-20,720 L-20,600 C400,580 900,600 1300,640 L1300,720Z" fill="#868a96"/>
  <ellipse cx="640" cy="506" rx="360" ry="40" fill="url(#${P}pool)"/>${baseArt(600,500,2)}
  ${naut(430,520,1.5,true)}${naut(480,522,1.5)}${naut(860,522,1.5)}${naut(910,520,1.5,true)}
  <g transform="translate(640 92)">${[0,1,2,3,4,5,6].map(i=>`<g transform="translate(${(i-3)*64} 0)"><circle r="22" fill="${i===0?'#5ee0e8':'rgba(94,224,232,.12)'}" stroke="#5ee0e8" stroke-width="2"/><text y="6" text-anchor="middle" font-family="Exo 2" font-weight="800" font-size="16" fill="${i===0?'#062030':'#cfefff'}">${i+1}</text></g>`).join('')}<text y="52" text-anchor="middle" font-family="Exo 2" font-weight="800" font-size="15" letter-spacing="2" fill="#9ff6ff">7 DAYS · KEEP YOUR CREW SAFE</text></g></svg>`}
function photoCard(){return `<div style="position:absolute;inset:0;background:#000"><img src="assets/shackleton-oblique.jpg" alt="Real orbiter view of Shackleton crater and the Connecting Ridge" style="position:absolute;left:0;top:54px;width:1280px;height:auto;display:block">
  <div style="position:absolute;left:791px;top:586px;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:3px solid #5ee0e8;box-shadow:0 0 0 6px rgba(94,224,232,.25),0 0 30px #5ee0e8" class="pulse"></div>
  <div style="position:absolute;left:836px;top:600px;background:rgba(6,22,32,.88);border:1.5px solid #5ee0e8;border-radius:10px;padding:5px 11px;font-family:'Exo 2';font-weight:800;font-size:14px;letter-spacing:.05em">MISSION 1 BASE: NEAR HERE<div style="font-family:Nunito;font-size:12px;opacity:.8;letter-spacing:0">Connecting Ridge site</div></div>
  <div style="position:absolute;right:18px;bottom:16px"><span class="badge b-nasa">✓ Real orbiter image (NASA LRO) · credit to confirm</span></div></div>`}

  html:()=>`<div class="ui panel modal" style="width:520px;border-color:#ffc24a"><span class="badge b-arch">✓ NASA DONKI · ARCHIVE</span><span class="x click" data-go="base">✕</span>
    <div style="font-size:19px;font-weight:800;margin:10px 0 6px">A real solar flare, 8 May 2024</div><div style="font-size:15px;line-height:1.5;opacity:.9">From NASA’s space-weather database (DONKI): a research log of past events, not a warning service. Shown as saved data, not live.</div>
    <div style="display:flex;gap:10px;margin-top:14px"><div class="btn sec" style="padding:9px 16px;font-size:14px">Open the real record ↗</div><div class="btn sec click" style="padding:9px 16px;font-size:14px" data-go="base">Back</div></div></div>`},
 {id:'ending',g:'Ending',name:'Ending story',cam:'title',art:()=>sceneTitle('en',true),note:'<b>Ending story (storybook art).</b> Every tier gets praise that names the player’s own choices, then the one-line lesson.',
  html:()=>`<div class="ui" style="left:50%;top:70px;transform:translateX(-50%);text-align:center;width:900px"><div class="h" style="font-size:16px;color:#9ff6ff">Mission 1 · Moon south pole · crew safe</div><div style="font-family:'Exo 2';font-weight:800;font-style:italic;font-size:64px;color:#ffd98a;text-shadow:0 0 30px rgba(255,194,74,.4)">MISSION COMPLETE</div><div style="font-size:24px;font-weight:800">with honors · ★ 11 / 12</div></div>
    <div class="ui storyc" style="bottom:40px"><div class="face">${FACE}</div><div class="bub panel"><div class="who">BASE BOT</div><p>You moved your crew into the shelter during a real solar storm from May 2024, and you mapped the dark crater before driving in. That’s real astronaut thinking.</p><div class="tags">${STORY}</div></div><div class="btn pri click" style="padding:12px 22px;font-size:17px" data-go="debrief">Next ▶</div></div>`},
 {id:'debrief',g:'Ending',name:'Debrief & replay',cam:'site',lines:true,dim:true,note:'<b>Debrief.</b> Final report, your week at a glance, the lesson, and replay options (new surprises / harder 14 days).',
  html:()=>`<div class="ui panel" style="left:60px;top:70px;width:520px;padding:20px 22px"><div class="h" style="font-size:17px">Mission tasks · 11 / 12 ★</div>
    ${[['Light','★★★'],['Radiation','★★★'],['Shelter','★★★'],['Ice','★★☆']].map(([a,b])=>`<div class="row"><span>${a}</span><span style="color:#ffc24a;letter-spacing:3px">${b}</span></div>`).join('')}
    <div style="margin-top:10px;font-size:14px;font-weight:700;opacity:.85">Try next time: find ice or bring back 2 samples.</div></div>
    <div class="ui panel" style="right:60px;top:70px;width:560px;padding:20px 22px"><div class="h" style="font-size:17px">Your week</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px;text-align:center">${[['1','☀','arrive'],['2','⚡','flare alert'],['3','☢','storm'],['4','☢','storm peak'],['5','◐','long shadow'],['6','◐','no Earth'],['7','★','report']].map(([d,i,t])=>`<div style="padding:8px 2px;border-radius:12px;border:1.5px solid rgba(94,224,232,.35)"><div style="font-size:14px;opacity:.7">Day ${d}</div><div style="font-size:22px">${i}</div><div style="font-size:13px;font-weight:800">${t}</div></div>`).join('')}</div>
    <div style="margin-top:14px;font-size:16px;font-weight:800;color:#ffd98a">Every choice costs something. On the Moon, light is a resource: where you work decides your power, cold, and radiation risk.</div></div>
    <div class="ui" style="left:50%;bottom:44px;transform:translateX(-50%);display:flex;gap:12px"><div class="btn pri click" style="padding:14px 24px;font-size:17px" data-go="story5">▶ Play again · new surprises</div><div class="btn sec" style="padding:14px 20px;font-size:15px">Harder: 14 days</div><div class="btn sec" style="padding:14px 20px;font-size:15px;opacity:.5">🔒 Mission 2: Mars</div><div class="btn sec click" style="padding:14px 20px;font-size:15px" data-go="title">I’m done</div></div>`},
];

/* ---------- one SVG icon set (replaces emoji, which render differently per device) ---------- */
const G=(d,fill)=>`<svg viewBox="0 0 24 24" fill="${fill?'currentColor':'none'}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const GLYPH={'⚡':['bolt',G('<path d="M13.5 2 4 14h6.5L9.5 22 20 9.5h-6.5z" stroke="none"/>',1)],
  '☢':['dose',G('<circle cx="12" cy="12" r="2.2" stroke="none"/><path d="M12 9.6 9.4 5.2A8 8 0 0 0 4 12h5.2M14.6 12H20a8 8 0 0 0-5.4-6.8L12 9.6M10.8 14.1 8.2 18.6a8 8 0 0 0 7.6 0l-2.6-4.5" stroke="none"/>',1)],
  '♥':['heart',G('<path d="M12 21s-7.5-4.6-9.6-9.2A5.2 5.2 0 0 1 12 6.3a5.2 5.2 0 0 1 9.6 5.5C19.5 16.4 12 21 12 21z" stroke="none"/>',1)],
  '☀':['sun',G('<circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>')],
  '⚙':['gear',G('<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>')],
  '🔒':['lock',G('<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/>')],
  '◐':['shadow',G('<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/>')],
  '⚠':['warn',G('<path d="M12 3 2.5 20h19z"/><path d="M12 10v4.5M12 17.4v.1"/>')],
  '◉':['rover',G('<path d="M3 15l2-6h10l2 3h4v3z" stroke="none"/><circle cx="7" cy="17.5" r="2.2" stroke="none"/><circle cx="17" cy="17.5" r="2.2" stroke="none"/>',1)],
  '★':['star',G('<path d="M12 2.8l2.8 6 6.6.7-4.9 4.5 1.4 6.5L12 17.2l-5.9 3.3 1.4-6.5-4.9-4.5 6.6-.7z" stroke="none"/>',1)],
  '☆':['stare',G('<path d="M12 2.8l2.8 6 6.6.7-4.9 4.5 1.4 6.5L12 17.2l-5.9 3.3 1.4-6.5-4.9-4.5 6.6-.7z" stroke-width="1.6"/>')],
  '?':['help',G('<circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.4a2.8 2.8 0 1 1 4 2.5c-.8.5-1.3 1-1.3 2M12 17.2v.1"/>')]};
const GRX=/[⚡☢♥☀⚙🔒◐⚠◉★☆]/u;
function iconize(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())if(GRX.test(w.currentNode.nodeValue)&&!w.currentNode.parentElement.closest('svg'))nodes.push(w.currentNode);
  for(const n of nodes){const f=document.createDocumentFragment();for(const ch of Array.from(n.nodeValue)){const g=GLYPH[ch];if(g&&ch!=='?'){const s=document.createElement('span');s.className='gi '+g[0];s.setAttribute('aria-hidden','true');s.innerHTML=g[1];f.appendChild(s)}else f.appendChild(document.createTextNode(ch))}n.replaceWith(f)}
  root.querySelectorAll('.ibtn').forEach(b=>{if(b.textContent.trim()==='?'){b.innerHTML='<span class="gi help" aria-hidden="true">'+GLYPH['?'][1]+'</span>';b.setAttribute('aria-label','Help')}})}
/* every control: a keyboard-reachable button with a name */
function a11y(root){root.querySelectorAll('[data-go],[data-toggle],.ibtn').forEach(el=>{if(el.tagName!=='BUTTON'){el.setAttribute('role','button');el.tabIndex=0}
  if(!el.getAttribute('aria-label')){const g=el.dataset.go,p=el.dataset.pin;const nm=p?PINS[p].nm:el.classList.contains('x')?'Close':g==='sunwatch'?'SunWatch alerts':g==='settings'&&!el.textContent.trim()?'Settings':g==='report'?'Mission tasks':null;if(nm)el.setAttribute('aria-label',nm)}})}
let REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ---------- navigation ---------- */
const nav=document.getElementById('nav');const groups=[...new Set(SCREENS.map(s=>s.g))];
nav.innerHTML=groups.map(g=>`<div class="navrow"><span class="g">${g}</span>${SCREENS.filter(s=>s.g===g).map(s=>`<button data-id="${s.id}">${s.name}</button>`).join('')}</div>`).join('');
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.id)});
stage.addEventListener('click',e=>{if(e.target.closest('[data-reset]')){flyTo(CAMS[cur.cam]);return}const tg=e.target.closest('[data-toggle]');if(tg){REDUCE=!REDUCE;go(cur.id,true);return}const t=e.target.closest('[data-go]');if(t)go(t.dataset.go)});
stage.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const t=e.target.closest('[data-go],[data-toggle]');if(!t)return;e.preventDefault();t.click()});
document.getElementById('ol').onclick=e=>{const on=!OUTL[0].visible;OUTL.forEach(h=>h.visible=on);e.target.textContent='Outlines: '+(on?'on':'off');e.target.setAttribute('aria-pressed',on)};
document.getElementById('prev').onclick=()=>{const i=SCREENS.findIndex(s=>s.id===cur.id);go(SCREENS[(i-1+SCREENS.length)%SCREENS.length].id)};
document.getElementById('next').onclick=()=>{const i=SCREENS.findIndex(s=>s.id===cur.id);go(SCREENS[(i+1)%SCREENS.length].id)};

let cur=null,anim=null,lightMode=null;
function setLight(m){if(m===lightMode)return;lightMode=m;const L=LIGHT[m],up=m==='sun';terrainMat.uniforms.sunD.value.set(...L);sun.position.copy(W(L[0]*1500,L[1]*1500,L[2]*1500));sun.target.position.set(0,0,0);sun.intensity=up?.55:0;hemi.intensity=up?2.6:.45; /* clip-art: mostly flat light, shadows stay soft */lamps.forEach(l=>l.intensity=up?0:40)}
function flyTo(C,instant){
  if(REDUCE&&!instant){if(camera.position.distanceTo(C.pos)>1||controls.target.distanceTo(C.tgt)>1){const fd=document.getElementById('fade');fd.style.opacity=1;anim=null;setTimeout(()=>{camera.position.copy(C.pos);controls.target.copy(C.tgt);camera.fov=C.fov;camera.updateProjectionMatrix();fd.style.opacity=0},300)}}
  else if(instant){anim=null;camera.position.copy(C.pos);controls.target.copy(C.tgt);camera.fov=C.fov;camera.updateProjectionMatrix()}
  else{const far=Math.max(camera.position.distanceTo(C.pos),controls.target.distanceTo(C.tgt));anim={t0:performance.now(),dur:far<50?Math.max(450,far*12):Math.min(2200,900+far*.05),p0:camera.position.clone(),q0:controls.target.clone(),f0:camera.fov,C,arc:Math.min(1500,far*.08)}}}
function go(id,instant){const S=SCREENS.find(s=>s.id===id);cur=S;
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));document.getElementById('note').innerHTML=S.note;
  setLight(S.dark?'dark':'sun');lines.visible=!!S.lines;route.visible=!!S.route;scene.traverse(o=>{if(o.userData.earth)o.visible=!S.dark;if(o.material&&o.material.isShadowMaterial)o.visible=['base','solar','hab','shelter','sky'].includes(S.cam)});
  const C=CAMS[S.cam];controls.autoRotate=!!C.orbit&&!REDUCE;frame.classList.toggle('rm',REDUCE);
  if(instant||REDUCE||!anim||anim.C!==C)flyTo(C,instant);
  let h=S.art?'':`<button class="ui reset" data-reset aria-label="Reset camera view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 4v4.5h4.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>Reset view</button>`;if(S.art)h+=`<div class="artl" role="img" aria-label="Illustration: ${S.name}">${S.art()}</div>`;if(S.dim)h+='<div class="dim"></div>';
  if(S.pins)for(const [k,p] of Object.entries(PINS))if(!(S.dark&&k==='earth'))h+=`<div class="pin ${S.sel===k?'sel':''} ${S.ring===k?'ring':''} ${S.id==='tutorial'&&!['hab','shelter'].includes(k)?'faded':''} click" data-pin="${k}" data-go="${k==='shelter'?'jobs':S.id}"><div class="o">${p.ic}</div><div class="stem"></div>${S.sel===k||S.ring===k?`<div class="nm">${p.nm}</div>`:''}</div>`;
  for(const k of (S.labs||[]))h+=`<div class="lab3 ${L3[k].warm?'warm':''}" data-lab="${k}"><div class="box"><div class="t">${L3[k].t}</div><div class="s">${L3[k].s}</div></div><div class="stem"></div><div class="dt"></div></div>`;
  stage.innerHTML=h+S.html();iconize(stage);a11y(stage);renderer.domElement.setAttribute('aria-hidden','true');}

/* ---------- render loop ---------- */
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1280,720),.35,.4,.95));composer.addPass(new OutputPass());
function resize(){const w=frame.clientWidth||728,h=Math.round(w*9/16),pr=renderer.getPixelRatio();OUT.uniforms.res.value.set(w*pr,h*pr);OUT.uniforms.w.value=Math.max(1.5,3.6*w/1280*pr);renderer.setSize(w,h,false);composer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();stage.style.transform=`scale(${w/1280})`}
new ResizeObserver(resize).observe(frame);resize();
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,v3=new THREE.Vector3();
const toStage=p=>{v3.copy(p).project(camera);return v3.z>1?null:[(v3.x+1)/2*1280,(1-v3.y)/2*720]};
function tick(now){
  if(anim){const t=Math.min(1,(now-anim.t0)/anim.dur),k=ease(t);camera.position.lerpVectors(anim.p0,anim.C.pos,k);camera.position.y+=Math.sin(k*Math.PI)*anim.arc;controls.target.lerpVectors(anim.q0,anim.C.tgt,k);camera.fov=anim.f0+(anim.C.fov-anim.f0)*k;camera.updateProjectionMatrix();if(t>=1)anim=null}
  const dt=Math.min(.1,(now-(tick.t||now))/1000);tick.t=now;if(!REDUCE){earthSurf.rotation.y+=dt*.035;EU.drift.value+=dt*.0025}
  controls.update();if(!cur.art)composer.render();
  const rb=stage.querySelector('[data-reset]');if(rb){const C=CAMS[cur.cam],tol=C.pos.distanceTo(C.tgt)*.02+.5;rb.classList.toggle('show',!anim&&(camera.position.distanceTo(C.pos)>tol||controls.target.distanceTo(C.tgt)>tol))}
  stage.querySelectorAll('[data-pin]').forEach(el=>{const s=toStage(PINS[el.dataset.pin].p);if(!s){el.style.display='none';return}el.style.display='flex';el.style.left=s[0]+'px';el.style.top=s[1]+'px'});
  stage.querySelectorAll('[data-lab]').forEach(el=>{const s=toStage(L3[el.dataset.lab].p());if(!s||s[0]<0||s[0]>1280||s[1]<0||s[1]>720){el.style.display='none';return}el.style.display='block';el.style.left=s[0]+'px';el.style.top=s[1]+'px'});
  stage.querySelectorAll('[data-anchor]').forEach(el=>{const s=toStage(PINS[el.dataset.anchor].p);if(!s)return;el.style.left=Math.max(10,Math.min(1280-340,s[0]+ +el.dataset.dx))+'px';el.style.top=Math.max(10,s[1]+ +el.dataset.dy)+'px'});
  requestAnimationFrame(tick)}
go(/*START*/'title',true);requestAnimationFrame(tick);
</script>
</body>
</html>
