<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base Screen Drafts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,800;1,800&family=Nunito:wght@600;700;800&family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  .mock { margin: 0 0 22px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; margin:0 0 8px; }
  .bar b { font: 600 14px var(--font-sans, system-ui); color: var(--foreground, #eee); }
  .seg { display:inline-flex; border:1px solid var(--border, #444); border-radius: var(--radius, 8px); overflow:hidden; }
  .seg button { font: 500 12px var(--font-sans, system-ui); padding:5px 10px; border:0; background:transparent; color: var(--muted-foreground, #aaa); cursor:pointer; }
  .seg button.on { background: var(--secondary, #333); color: var(--foreground, #fff); }
  .ctrls { display:flex; gap:8px; flex-wrap:wrap; }
  .frame { position:relative; width:100%; aspect-ratio:16/9; border-radius: var(--radius, 8px); overflow:hidden; background:#050810; }
  .stage { position:absolute; left:0; top:0; width:1280px; height:720px; transform-origin:0 0; color:#e6fbff; }
  .stage canvas.scene { position:absolute; left:0; top:0; width:1280px; height:720px; }
  .px canvas.scene { image-rendering: pixelated; }
  .stage svg.lines { position:absolute; left:0; top:0; width:1280px; height:720px; pointer-events:none; }
  .ui { position:absolute; }
  .stage, .stage * { box-sizing:border-box; }

  /* ---------- shared layout ---------- */
  .title { left:28px; top:22px; display:flex; gap:14px; align-items:flex-start; }
  .emblem { width:58px; height:58px; flex:none; }
  .t1 { font-size:40px; line-height:1; }
  .t1 small { font-size:20px; opacity:.75; margin-left:4px; }
  .t2 { font-size:15px; opacity:.85; margin-top:4px; }
  .prog { width:250px; height:10px; margin-top:8px; position:relative; }
  .prog i { position:absolute; left:0; top:0; bottom:0; }
  .chip { display:inline-block; margin-top:10px; font-size:14px; padding:4px 10px; }

  .days { left:420px; top:24px; width:440px; }
  .days .row { display:flex; gap:6px; }
  .days .d { flex:1; height:26px; position:relative; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .days .lab { display:flex; justify-content:space-between; font-size:12px; margin-top:6px; opacity:.85; }
  .days .fc { position:absolute; top:34px; font-size:12px; white-space:nowrap; }

  .res { right:24px; top:20px; width:270px; padding:12px 14px 10px; }
  .res .r { display:grid; grid-template-columns: 24px 74px 1fr 34px; align-items:center; gap:8px; height:32px; }
  .res .ic { width:22px; height:22px; }
  .res .nm { font-size:14px; }
  .res .v { font-size:16px; text-align:right; }
  .res .track { height:10px; position:relative; }
  .res .track i { position:absolute; left:0; top:0; bottom:0; }
  .res .foot { margin-top:6px; display:flex; justify-content:flex-end; }

  .card { right:24px; top:214px; width:270px; padding:12px 14px; }
  .card .hd { display:flex; justify-content:space-between; align-items:baseline; font-size:14px; margin-bottom:6px; }
  .card .r { display:flex; justify-content:space-between; font-size:15px; height:26px; align-items:center; }
  .card .st { letter-spacing:2px; font-size:16px; }
  .card .hint { font-size:13px; margin-top:6px; opacity:.85; }

  .place { transform: translate(-50%, -100%); white-space:nowrap; cursor:pointer; padding:4px 10px; font-size:14px; }
  .place.below { transform: translate(-50%, 0); }
  .place small { display:block; font-size:12px; opacity:.8; }

  .jobs { left:28px; top:178px; width:340px; padding:12px 14px; }
  .jobs .hd { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .jobs .x { cursor:pointer; font-size:18px; line-height:1; opacity:.8; }
  .jobs .sub { font-size:13px; opacity:.85; margin:4px 0 8px; }
  .job { display:grid; grid-template-columns: 1fr auto; gap:4px 8px; padding:8px 0; }
  .job .n { font-size:15px; }
  .job .tag { font-size:11px; padding:1px 6px; margin-left:6px; vertical-align:2px; }
  .job .costs { grid-column:1; display:flex; flex-wrap:wrap; gap:4px; font-size:12px; }
  .job .costs span { padding:1px 6px; }
  .job .add { grid-row:1 / span 2; grid-column:2; align-self:center; font-size:13px; padding:6px 10px; cursor:pointer; }

  .portrait { left:24px; bottom:22px; width:128px; height:128px; }
  .bubble { left:164px; bottom:24px; width:532px; min-height:112px; padding:20px 18px 12px; }
  .bubble .who { position:absolute; left:16px; top:-14px; font-size:13px; padding:2px 10px; }
  .bubble p { margin:0; font-size:18px; line-height:1.38; }
  .bubble .tags { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }

  .btns { left:716px; bottom:30px; display:flex; gap:12px; }
  .btn { width:76px; text-align:center; cursor:pointer; position:relative; }
  .btn .sq { width:76px; height:66px; display:flex; align-items:center; justify-content:center; }
  .btn .sq .ic { width:28px; height:28px; }
  .btn .l { font-size:13px; margin-top:6px; }
  .btn .dot { position:absolute; right:-4px; top:-6px; font-size:12px; width:22px; height:22px; display:flex; align-items:center; justify-content:center; }

  .plan { right:24px; bottom:24px; width:262px; padding:12px 14px; }
  .plan .hd { display:flex; justify-content:space-between; font-size:13px; }
  .chips { display:flex; gap:6px; margin:8px 0; }
  .chips i { width:22px; height:22px; display:block; }
  .plan .after { font-size:13px; opacity:.9; line-height:1.4; }
  .end { margin-top:10px; text-align:center; font-size:18px; padding:10px 0; cursor:pointer; }

  .badge { font-size:11.5px; padding:2px 7px; white-space:nowrap; }

  /* ---------- VECTOR theme (cyan console, rounded, glow) ---------- */
  .vec { font-family: 'Nunito', system-ui, sans-serif; }
  .vec .h { font-family:'Exo 2', sans-serif; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
  .vec .t1 { font-style:italic; text-shadow:0 0 18px rgba(94,224,232,.45); }
  .vec .panel { background:rgba(6,26,36,.80); border:2px solid rgba(94,224,232,.85); border-radius:14px;
    box-shadow:0 0 18px rgba(94,224,232,.22), inset 0 0 22px rgba(94,224,232,.07); backdrop-filter: blur(3px); }
  .vec .prog { background:rgba(94,224,232,.15); transform:skewX(-24deg); border:1px solid rgba(94,224,232,.6); }
  .vec .prog i { background:linear-gradient(90deg,#3cc7d6,#9ff6ff); box-shadow:0 0 10px #5ee0e8; }
  .vec .chip { background:rgba(255,194,74,.12); border:1.5px solid #ffc24a; color:#ffd98a; border-radius:999px; font-weight:800; }
  .vec .chip.dark { background:rgba(140,160,255,.12); border-color:#9aa8ff; color:#c9d0ff; }
  .vec .days .d { border-radius:6px; background:rgba(94,224,232,.08); border:1.5px solid rgba(94,224,232,.35); color:rgba(230,251,255,.6); font-weight:800; }
  .vec .days .d.past { background:rgba(94,224,232,.35); border-color:transparent; color:#062030; }
  .vec .days .d.now { background:#5ee0e8; color:#062030; box-shadow:0 0 14px #5ee0e8; border-color:#c9fbff; }
  .vec .days .d.f { border-style:dashed; border-color:#9aa8ff; }
  .vec .days .fc { color:#c9d0ff; }
  .vec .res .track { background:rgba(255,255,255,.1); border-radius:99px; overflow:hidden; }
  .vec .res .track i { border-radius:99px; }
  .vec .res .v, .vec .res .nm { font-weight:800; }
  .vec .card .st { color:#ffc24a; }
  .vec .place { background:rgba(6,26,36,.78); border:1.5px solid rgba(94,224,232,.8); border-radius:8px; font-weight:800; }
  .vec .place.sel { background:#5ee0e8; color:#062030; }
  .vec .job { border-top:1px solid rgba(94,224,232,.2); }
  .vec .job .n { font-weight:800; }
  .vec .job .tag { border-radius:99px; background:#ffc24a; color:#2a1a00; font-weight:800; }
  .vec .job .costs span { border-radius:6px; background:rgba(255,255,255,.08); }
  .vec .job .costs span.out { background:rgba(255,194,74,.18); color:#ffd98a; }
  .vec .job .add { border-radius:8px; border:1.5px solid #5ee0e8; color:#9ff6ff; font-weight:800; }
  .vec .portrait { border-radius:50%; border:3px solid #5ee0e8; overflow:hidden; box-shadow:0 0 22px rgba(94,224,232,.4); background:#0b2a3a; }
  .vec .bubble .who { background:#5ee0e8; color:#062030; border-radius:6px; font-family:'Exo 2'; font-weight:800; letter-spacing:.08em; }
  .vec .btn .sq { border-radius:14px; }
  .vec .btn .l { font-weight:800; opacity:.9; }
  .vec .btn .dot { border-radius:50%; background:#ffc24a; color:#2a1a00; font-weight:800; }
  .vec .chips i { border-radius:50%; border:2px solid rgba(94,224,232,.5); }
  .vec .chips i.in { background:#5ee0e8; border-color:#5ee0e8; box-shadow:0 0 8px #5ee0e8; }
  .vec .chips i.out { background:#ffc24a; border-color:#ffc24a; box-shadow:0 0 8px #ffc24a; }
  .vec .end { border-radius:12px; background:linear-gradient(180deg,#7ff0f8,#3cc7d6); color:#062030; font-family:'Exo 2'; font-weight:800; letter-spacing:.1em; box-shadow:0 0 18px rgba(94,224,232,.5); }
  .vec .badge { border-radius:6px; font-weight:800; }
  .vec .b-arch { border:1.5px solid #ffc24a; color:#ffd98a; }
  .vec .b-ai, .vec .b-sim { border:1.5px dashed rgba(230,251,255,.5); color:rgba(230,251,255,.75); }

  /* ---------- PIXEL theme (16-bit, notched corners, pixel fonts) ---------- */
  .px { font-family:'Pixelify Sans', monospace; --notch: polygon(4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px), 0 4px, 4px 4px); }
  .px .h { font-family:'Press Start 2P', monospace; text-transform:uppercase; letter-spacing:0; }
  .px .t1 { font-size:28px; }
  .px .t1 small { font-size:14px; }
  .px .t2 { font-size:16px; }
  .px .panel { background:#0a1f2b; border:4px solid #5ee0e8; clip-path:var(--notch); box-shadow: inset 4px 4px 0 #134257, inset -4px -4px 0 #051219; }
  .px .prog { background:#0a1f2b; border:4px solid #5ee0e8; height:16px; }
  .px .prog i { background: repeating-linear-gradient(90deg,#9ff6ff 0 12px,#3cc7d6 12px 16px); }
  .px .chip { background:#3a2a08; border:4px solid #ffc24a; color:#ffe9b0; clip-path:var(--notch); font-size:15px; }
  .px .chip.dark { background:#1b1f45; border-color:#9aa8ff; color:#d6dbff; }
  .px .days .d { background:#0a1f2b; border:4px solid #1f6f7a; color:#5f9aa3; font-family:'Press Start 2P'; font-size:9px; }
  .px .days .d.past { background:#1f6f7a; color:#cfffff; }
  .px .days .d.now { background:#5ee0e8; border-color:#e6fbff; color:#062030; }
  .px .days .d.f { border-color:#9aa8ff; }
  .px .days .fc { color:#d6dbff; font-size:14px; }
  .px .days .lab { font-size:14px; }
  .px .res .track { background:#051219; height:12px; }
  .px .res .track i { background-image: repeating-linear-gradient(90deg, transparent 0 12px, #051219 12px 16px) !important; }
  .px .res .nm { font-size:15px; }
  .px .res .v { font-family:'Press Start 2P'; font-size:12px; }
  .px .card .st { color:#ffc24a; font-size:18px; }
  .px .card .r { font-size:16px; }
  .px .place { background:#0a1f2b; border:4px solid #5ee0e8; clip-path:var(--notch); font-size:15px; }
  .px .place.sel { background:#5ee0e8; color:#062030; }
  .px .job { border-top:4px solid #134257; }
  .px .job .n { font-size:16px; }
  .px .job .tag { background:#ffc24a; color:#2a1a00; font-size:12px; }
  .px .job .costs span { background:#134257; font-size:13px; }
  .px .job .costs span.out { background:#5a3d08; color:#ffe9b0; }
  .px .job .add { border:4px solid #5ee0e8; color:#9ff6ff; clip-path:var(--notch); }
  .px .portrait { background:#0b2a3a; border:4px solid #5ee0e8; clip-path:var(--notch); }
  .px .portrait canvas { image-rendering: pixelated; width:100%; height:100%; display:block; }
  .px .bubble { padding-top:42px; }
  .px .bubble .who { top:12px; left:14px;  background:#5ee0e8; color:#062030; font-family:'Press Start 2P'; font-size:11px; padding:5px 10px; }
  .px .bubble p { font-size:19px; line-height:1.35; }
  .px .btn .l { font-size:14px; }
  .px .btn .dot { background:#ffc24a; color:#2a1a00; font-family:'Press Start 2P'; font-size:10px; }
  .px .chips i { border:4px solid #1f6f7a; }
  .px .chips i.in { background:#5ee0e8; border-color:#5ee0e8; }
  .px .chips i.out { background:#ffc24a; border-color:#ffc24a; }
  .px .end { background:#5ee0e8; color:#062030; font-family:'Press Start 2P'; font-size:15px; clip-path:var(--notch); box-shadow: inset -4px -4px 0 #2a9aa6, inset 4px 4px 0 #c9fbff; }
  .px .badge { font-size:13px; }
  .px .b-arch { border:4px solid #ffc24a; color:#ffe9b0; }
  .px .b-ai, .px .b-sim { border:4px dashed #6c8a92; color:#b9cdd2; }
  .px .ic { image-rendering: pixelated; }
</style>
</head>
<body>
<div id="mocks"></div>
<script>
/* ======================= math + scene ======================= */
const W = 1280, H = 720, D2R = Math.PI / 180;
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
      mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
      cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
      norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]};
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const dirAE=(az,el)=>[Math.sin(az*D2R)*Math.cos(el*D2R), Math.sin(el*D2R), Math.cos(az*D2R)*Math.cos(el*D2R)];

// Sun drawn at 4 deg (real polar max is about 1.5 deg) so shapes read; Earth low in the sky.
const SUN_AZ = -30, SUN = dirAE(SUN_AZ, 4), SUN_DOWN = dirAE(SUN_AZ, -2), EARTH = dirAE(0, 8);

const VIEWS = {
  low:  { tx:-8.7, ty:3, tz:42.6, dist:38, pitch:0,  yaw:-17, fov:40, name:'Low (like ref)' },
  high: { tx:-7.5, ty:0, tz:44.6, dist:58, pitch:13, yaw:-17, fov:50, name:'High 3/4' },
  wide: { tx:-5.5, ty:0, tz:74.7, dist:112, pitch:7, yaw:-19, fov:34, name:'Wide' },
};
function camFrom(v){
  const p=v.pitch*D2R, y=v.yaw*D2R;
  const f=[Math.sin(y)*Math.cos(p), -Math.sin(p), Math.cos(y)*Math.cos(p)];
  const r=[Math.cos(y),0,-Math.sin(y)];
  const u=cross(f,r);
  const C=[v.tx-f[0]*v.dist, v.ty-f[1]*v.dist, v.tz-f[2]*v.dist];
  return {C,f,r,u,F:(H/2)/Math.tan(v.fov*D2R/2),v};
}
const toCam=(cam,P)=>{const d=sub(P,cam.C);return [dot(d,cam.r),dot(d,cam.u),dot(d,cam.f)]};
const proj=(cam,c)=>[W/2+c[0]/c[2]*cam.F, H/2-c[1]/c[2]*cam.F];
function projDir(cam,d){const x=dot(d,cam.r),y=dot(d,cam.u),z=dot(d,cam.f);if(z<=0.01)return null;return [W/2+x/z*cam.F,H/2-y/z*cam.F]}
function projPt(cam,P){const c=toCam(cam,P);if(c[2]<0.5)return null;return proj(cam,c)}
function clipNear(poly,n=0.5){const o=[];for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],ai=a[2]>=n,bi=b[2]>=n;if(ai)o.push(a);if(ai!==bi){const t=(n-a[2])/(b[2]-a[2]);o.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,n])}}return o}
function pathWorld(ctx,cam,pts){const c=clipNear(pts.map(p=>toCam(cam,p)));if(c.length<3)return false;ctx.beginPath();c.forEach((q,i)=>{const s=proj(cam,q);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1])});ctx.closePath();return true}

function mkFace(p,col,o={}){let n=[0,0,0];for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];n[0]+=(a[1]-b[1])*(a[2]+b[2]);n[1]+=(a[2]-b[2])*(a[0]+b[0]);n[2]+=(a[0]-b[0])*(a[1]+b[1])}
  const c=mul(p.reduce((s,q)=>add(s,q),[0,0,0]),1/p.length);return Object.assign({p,n:norm(n),c,col},o)}
function orient(fs,ctr){fs.forEach(f=>{if(!f.two&&dot(f.n,sub(f.c,ctr))<0)f.n=mul(f.n,-1)});return fs}
const rotY=(x,z,t)=>[x*Math.cos(t)+z*Math.sin(t), -x*Math.sin(t)+z*Math.cos(t)];

function box(c,s,col,yaw=0,o={}){const t=yaw*D2R,P=(x,y,z)=>{const r=rotY(x,z,t);return [c[0]+r[0],c[1]+y,c[2]+r[1]]};
  const [a,b,d]=[s[0]/2,s[1],s[2]/2];const v=[P(-a,0,-d),P(a,0,-d),P(a,0,d),P(-a,0,d),P(-a,b,-d),P(a,b,-d),P(a,b,d),P(-a,b,d)];
  const fs=[[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7],[4,5,6,7],[0,3,2,1]].map(q=>mkFace(q.map(i=>v[i]),col,o));
  return orient(fs,[c[0],c[1]+b/2,c[2]])}
function cylX(c,len,r,n,col,yaw=0){const t=yaw*D2R,P=(x,y,z)=>{const q=rotY(x,z,t);return [c[0]+q[0],c[1]+y,c[2]+q[1]]};const fs=[],A=[],B=[];
  for(let i=0;i<n;i++){const a=i/n*2*Math.PI;A.push(P(-len/2,r*Math.sin(a),-r*Math.cos(a)));B.push(P(len/2,r*Math.sin(a),-r*Math.cos(a)))}
  for(let i=0;i<n;i++){const j=(i+1)%n;fs.push(mkFace([A[i],A[j],B[j],B[i]],col))}
  fs.push(mkFace(A.slice(),col),mkFace(B.slice(),col));return orient(fs,c)}
function dome(c,rx,h,rz,col,nu=18,nv=5,seed=3){const R=rng(seed),j=[];for(let i=0;i<nu;i++)j.push(1+(R()-.5)*.14);const rows=[];
  for(let v=0;v<=nv;v++){const ph=v/nv*Math.PI/2,row=[];for(let u=0;u<nu;u++){const a=u/nu*2*Math.PI,k=Math.cos(ph)*(v<nv?j[u]:1);row.push([c[0]+rx*k*Math.cos(a),h*Math.sin(ph)*(v>0&&v<nv?j[(u+2)%nu]:1),c[2]+rz*k*Math.sin(a)])}rows.push(row)}
  const fs=[];for(let v=0;v<nv;v++)for(let u=0;u<nu;u++){const w=(u+1)%nu;if(v===nv-1)fs.push(mkFace([rows[v][u],rows[v][w],rows[v+1][0]],col));else fs.push(mkFace([rows[v][u],rows[v][w],rows[v+1][w],rows[v+1][u]],col))}
  return orient(fs,[c[0],h*0.3,c[2]])}
function rock(c,s,R){const b=[];for(let i=0;i<4;i++){const a=i/4*2*Math.PI+R()*.8;b.push([c[0]+Math.cos(a)*s*(.7+R()*.5),0,c[2]+Math.sin(a)*s*(.7+R()*.5)])}
  const ap=[c[0]+(R()-.5)*s*.6,s*(.5+R()*.6),c[2]+(R()-.5)*s*.6];const g=150+R()*40;
  return orient(b.map((q,i)=>mkFace([q,b[(i+1)%4],ap],[g,g-4,g-10])),[c[0],s*.25,c[2]])}
function disk(ctr,n,r,k,col){const a=Math.abs(n[1])<.9?[0,1,0]:[1,0,0],e1=norm(cross(n,a)),e2=cross(n,e1),p=[];
  for(let i=0;i<k;i++){const t=i/k*2*Math.PI;p.push(add(ctr,add(mul(e1,Math.cos(t)*r),mul(e2,Math.sin(t)*r))))}return [mkFace(p,col,{two:true})]}

/* ---- the base ---- */

  heart:['.##..##.','########','########','########','.######.','..####..','...##...','........'],
  sun:['#..#..#.','.#.#.#..','..###...','#######.','..###...','.#.#.#..','#..#..#.','........'],
  star:['...#....','..###...','..###...','#######.','.#####..','..###...','.##.##..','.#...#..'],
  help:['..####..','.##..##.','.....##.','....##..','...##...','...##...','........','...##...'],
};
function spriteURL(map,cols){const h=map.length,w=map[0].length,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  map.forEach((row,j)=>[...row].forEach((ch,i)=>{if(cols[ch]){x.fillStyle=cols[ch];x.fillRect(i,j,1,1)}}));return c.toDataURL()}
const pic=(k,col)=>`<img class="ic" src="${spriteURL(PIC[k],{'#':col})}" alt="">`;
const ROBOT=['.......oo.......','.......oo.......','........g.......','....wwwwwwww....','...wwwwwwwwww...','..wwkkkkkkkkww..','..wkkkkkkkkkkw..','..wkkcckkcckkw..','..wkkcckkcckkw..','..wkkkkkkkkkkw..','..wwkkkkkkkkww..','...wwwwwwwwww...','....gwwwwwwg....','..wwwwwwwwwwww..','.wwwwwggggwwwww.','.wwwwwgoogwwwww.'];
const ROBOT_SVG=`<svg viewBox="0 0 100 100" width="100%" height="100%"><rect width="100" height="100" fill="#0b2a3a"/><circle cx="50" cy="50" r="46" fill="#12384c"/>
 <line x1="50" y1="14" x2="50" y2="26" stroke="#cfd8e0" stroke-width="3"/><circle cx="50" cy="12" r="5" fill="#ff9a4a"/>
 <rect x="22" y="24" width="56" height="44" rx="18" fill="#eef3f7"/><rect x="29" y="31" width="42" height="28" rx="12" fill="#0b1a2a"/>
 <ellipse cx="41" cy="45" rx="5" ry="6.5" fill="#5ee0e8"/><ellipse cx="59" cy="45" rx="5" ry="6.5" fill="#5ee0e8"/>
 <path d="M44 53q6 4 12 0" stroke="#5ee0e8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <path d="M18 100 q4-26 32-26 q28 0 32 26z" fill="#e3e9ee"/><rect x="42" y="82" width="16" height="10" rx="3" fill="#ff9a4a"/></svg>`;

const JOBS={
  solar:{t:'Solar arrays',s:'Tall panels turn to follow the low Sun.',j:[{n:'Log sunlight & shadows',tm:1,c:['⚡ −2'],tag:'LIGHT'},{n:'Clean dust off panels',tm:2,c:['O₂ −2','dose +1'],out:1},{n:'Repair a fault',tm:2,c:['⚡ −10']}]},
  sun:{t:'The Sun',s:'Here it skims the horizon all day.',j:[{n:'Log sunlight & shadows',tm:1,c:['⚡ −2'],tag:'LIGHT'}]},
  hab:{t:'Habitat',s:'Home for the crew of 4.',j:[{n:'Tune the air system',tm:1,c:['⚡ −20','O₂ +30']},{n:'Measure radiation',tm:1,c:['⚡ −4'],tag:'RADIATION'},{n:'Power-saving mode',tm:1,c:['stamina −10','base uses half power']},{n:'Rest (2 crew)',tm:2,c:['O₂ −1','stamina +20']}]},
  shelter:{t:'Shelter · level 1',s:'Moon soil blocks space radiation. NASA designs use about 3 m of it.',j:[{n:'Pile soil on shelter',tm:4,c:['⚡ −10','O₂ −4','dose +2'],out:1,tag:'SHELTER'},{n:'Shelter during peak',tm:4,c:['⚡ +5','storm days only'],tag:'SHELTER'}]},
  rover:{t:'Rover & hop-drone',s:'Your ride to the dark crater.',j:[{n:'Scout with hop-drone',tm:1,c:['⚡ −15','ice odds +25%'],tag:'ICE'},{n:'Rover to dark crater',tm:4,c:['⚡ −50','O₂ −8','dose +4'],out:1,tag:'ICE'}]},
  crater:{t:'Dark crater',s:'Never sunlit. As cold as −414°F. Ice may hide here.',j:[{n:'Rover to dark crater',tm:4,c:['⚡ −50','O₂ −8','dose +4'],out:1,tag:'ICE'}]},
  earth:{t:'Earth',s:'Radio link to Mission Control.',j:[{n:'Call Mission Control',tm:1,c:['⚡ −5','2-day storm forecast']}]},
};
// where each place label sits: world anchor + how far up (negative = below)
const PLACES={
  solar:{lab:'Solar arrays',a:()=>[MASTS[1][0],13.2,MASTS[1][1]],up:26},
  hab:{lab:'Habitat',a:()=>[HAB.x,HAB.cy+HAB.r+.2,HAB.z],up:40},
  shelter:{lab:'Shelter',sub:'level 1',a:()=>[SHEL.x,3.5,SHEL.z],up:50},
  rover:{lab:'Rover',a:()=>[ROVER.x,2.4,ROVER.z],up:34},
  crater:{lab:'Dark crater',sub:'never sunlit',a:()=>[CRATER.x,1.4,CRATER.z],up:-40},
  earth:{lab:'Earth',sub:'radio link up',dir:EARTH,up:-28},
};

function makeMock(root, style){
  const px=style==='px', st={view:'low', light:'sun', sel:'shelter'};
  const ic=(k,col)=>px?pic(k,col):VIC[k].replace('<svg','<svg style="color:'+col+'"');
  root.innerHTML=`<div class="bar"><b>${px?'B · 16-bit pixel':'A · Vector'}</b><div class="ctrls">
    <div class="seg" data-k="view">${Object.entries(VIEWS).map(([k,v])=>`<button data-v="${k}">${v.name}</button>`).join('')}</div>
    <div class="seg" data-k="light"><button data-v="sun">Sunlight</button><button data-v="dark">Long shadow</button></div></div></div>
    <div class="frame ${style}"><div class="stage">
      <canvas class="scene"></canvas><svg class="lines" viewBox="0 0 1280 720"></svg>
      <div class="ui title"><div class="emblem">${px?`<canvas width="16" height="16" style="width:58px;height:58px;image-rendering:pixelated"></canvas>`:`<svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="26" fill="none" stroke="#5ee0e8" stroke-width="2.5"/><path d="M8 38 L22 24 L30 32 L37 26 L50 38" fill="none" stroke="#5ee0e8" stroke-width="2.5" stroke-linejoin="round"/><circle cx="20" cy="17" r="4.5" fill="#ffc24a"/><path d="M8 38h42" stroke="#5ee0e8" stroke-width="2.5"/></svg>`}</div>
        <div><div class="h t1">Day 4<small>of 14</small></div><div class="t2">Shackleton Ridge · Moon south pole</div><div class="prog"><i style="width:28%"></i></div><div class="chip" data-chip></div></div></div>
      <div class="ui days"><div class="row">${Array.from({length:14},(_,i)=>`<div class="d ${i<3?'past':i===3?'now':''} ${i===8||i===9?'f':''}">${i+1}</div>`).join('')}</div>
        <div class="fc" style="left:${8*40+4}px">◐ long shadow (forecast)</div><div class="lab"><span>MISSION DAYS</span><span>&nbsp;</span></div></div>
      <div class="ui res panel" data-res></div>
      <div class="ui card panel"><div class="hd"><span class="h">Report card</span><span>4 / 12 ★</span></div>
        ${[['Light',2],['Radiation',1],['Shelter',1],['Ice',0]].map(([n,s])=>`<div class="r"><span>${n}</span><span class="st">${'★'.repeat(s)}${'☆'.repeat(3-s)}</span></div>`).join('')}
        <div class="hint" data-hint></div></div>
      <div data-places></div>
      <div class="ui jobs panel" data-jobs></div>
      <div class="ui portrait">${px?'<canvas width="16" height="16"></canvas>':ROBOT_SVG}</div>
      <div class="ui bubble panel"><div class="who">Base Bot · name TBD</div><p data-say></p><div class="tags" data-tags></div></div>
      <div class="ui btns">
        <div class="btn"><div class="sq panel">${ic('sun','#ffc24a')}</div><div class="l">SunWatch</div><div class="dot">!</div></div>
        <div class="btn"><div class="sq panel">${ic('star','#ffc24a')}</div><div class="l">Report</div></div>
        <div class="btn"><div class="sq panel">${ic('help','#9ff6ff')}</div><div class="l">Help</div></div></div>
      <div class="ui plan panel"><div class="hd"><span class="h">Crew time</span><span data-used></span></div>
        <div class="chips">${['out','out','out','out','in','','',''].map(c=>`<i class="${c}"></i>`).join('')}</div>
        <div class="after" data-after></div><div class="end">End day ▶</div></div>
    </div></div>`;
  const frame=root.querySelector('.frame'), stage=root.querySelector('.stage'), cv=root.querySelector('canvas.scene');
  if(px){const e=root.querySelector('.emblem canvas').getContext('2d');const m=['................','.....######.....','...##......##...','..#..........#..','.#..oo........#.','.#..oo........#.','#..............#','#.....##.......#','#....#..#..##..#','#...#....##..#.#','################','.#............#.','..#..........#..','...##......##...','.....######.....','................'];
    m.forEach((r,j)=>[...r].forEach((c,i)=>{if(c!=='.'){e.fillStyle=c==='o'?'#ffc24a':'#5ee0e8';e.fillRect(i,j,1,1)}}));
    const p=root.querySelector('.portrait canvas').getContext('2d');p.fillStyle='#12384c';p.fillRect(0,0,16,16);
    ROBOT.forEach((r,j)=>[...r].forEach((c,i)=>{const col={w:'#eef3f7',g:'#96929c',k:'#0b1a2a',c:'#5ee0e8',o:'#ff9a4a'}[c];if(col){p.fillStyle=col;p.fillRect(i,j,1,1)}}))}
  const fit=()=>{stage.style.transform=`scale(${frame.clientWidth/1280})`};new ResizeObserver(fit).observe(frame);fit();
  root.querySelectorAll('.seg').forEach(sg=>sg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st[sg.dataset.k]=b.dataset.v;render()}));

  function render(){
    const sunUp=st.light==='sun';
    root.querySelectorAll('.seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',st[sg.dataset.k]===b.dataset.v)));
    // scene
    let cam;
    if(px){cv.width=320;cv.height=180;const c=cv.getContext('2d');c.setTransform(.25,0,0,.25,0,0);cam=drawScene(c,st,true);quantize(cv)}
    else{const dpr=Math.min(2,window.devicePixelRatio||1)*Math.max(.6,frame.clientWidth/1280);cv.width=Math.round(1280*dpr);cv.height=Math.round(720*dpr);const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);cam=drawScene(c,st,false)}
    // HUD text
    const chip=root.querySelector('[data-chip]');chip.className='chip'+(sunUp?'':' dark');
    chip.innerHTML=sunUp?'☀ Sunlight · panels charging':'◐ Long shadow · sun back in 2 days';
    const R=[['bolt','Power',sunUp?72:38,'#ffd34d'],['o2','Oxygen',61,'#7fe3ff'],['dose','Dose',18,'#c59bff'],['heart','Stamina',74,'#ff7b8f']];
    root.querySelector('[data-res]').innerHTML=R.map(([k,n,v,c])=>`<div class="r">${ic(k,c)}<span class="nm">${n}</span><span class="track"><i style="width:${v}%;background:${c}"></i></span><span class="v">${v}</span></div>`).join('')+`<div class="foot"><span class="badge b-sim">~ SIMULATED game numbers</span></div>`;
    root.querySelector('[data-hint]').textContent=sunUp?'Next star: shelter during a storm':'Next star: log sunlight while it’s dark';
    root.querySelector('[data-say]').textContent=sunUp
      ?'Commander! Mission Control says the Sun just shot out a big flare. A particle storm could reach us tomorrow. Finish outside jobs today, or get the shelter ready.'
      :'The Sun has dipped behind the hills, so the panels can’t charge. It comes back in about 2 days. Let’s save power: skip the rover and try Power-saving mode.';
    root.querySelector('[data-tags]').innerHTML=sunUp?'<span class="badge b-arch">✓ NASA DONKI · ARCHIVE May 2024</span><span class="badge b-ai">AI-written story</span>':'<span class="badge b-sim">~ SIMULATED shadow</span><span class="badge b-ai">AI-written story</span>';
    root.querySelector('[data-used]').textContent='5 of 8 used';
    root.querySelector('[data-after]').innerHTML=sunUp?'After today: ⚡ 72→48 · O₂ 61→83 · dose 18→22<br>3 unused = crew rests':'After today: ⚡ 38→6 ⚠ · O₂ 61→83 · dose 18→22<br>Battery nearly empty!';
    // place labels
    const pl=root.querySelector('[data-places]'), svg=root.querySelector('svg.lines');let html='',lines='';const pos={};
    for(const [k,p] of Object.entries(PLACES)){
      let s=p.dir?projDir(cam,k==='sun'&&!sunUp?SUN_DOWN:p.dir):projPt(cam,p.a());
      if(k==='sun'&&!sunUp&&s){s=[s[0],projDir(cam,dirAE(cam.v.yaw,0))[1]-6]}
      if(!s||s[0]<40||s[0]>1240||s[1]<20||s[1]>700)continue;
      if(s[0]>960&&s[1]<210)continue; // hidden under the meters panel
      const ly=s[1]-p.up; pos[k]=[s[0],ly];
      const sub=k==='sun'&&!sunUp?'behind the hills':p.sub;
      html+=`<div class="ui place ${p.up<0?'below':''} ${st.sel===k?'sel':''}" data-p="${k}" style="left:${s[0]}px;top:${ly}px"><span class="h" style="font-size:${px?'12':'13'}px">${p.lab}</span>${sub?`<small>${sub}</small>`:''}</div>`;
      const sw=px?4:2;lines+=px?`<rect x="${Math.round(s[0]/4)*4-2}" y="${Math.min(s[1],ly)}" width="4" height="${Math.abs(ly-s[1])}" fill="#5ee0e8" opacity=".8"/><rect x="${Math.round(s[0]/4)*4-4}" y="${Math.round(s[1]/4)*4-4}" width="8" height="8" fill="#5ee0e8"/>`
        :`<line x1="${s[0]}" y1="${s[1]}" x2="${s[0]}" y2="${ly}" stroke="#5ee0e8" stroke-width="${sw}" opacity=".75"/><circle cx="${s[0]}" cy="${s[1]}" r="4" fill="#5ee0e8"/>`;
    }
    pl.innerHTML=html;svg.innerHTML=lines;
    pl.querySelectorAll('.place').forEach(el=>el.addEventListener('click',()=>{st.sel=el.dataset.p;render()}));
    // job card
    const jc=root.querySelector('[data-jobs]');
    if(st.sel){const J=JOBS[st.sel];
      jc.style.display='block';
      jc.innerHTML=`<div class="hd"><span class="h" style="font-size:${px?13:16}px">${J.t}</span><span class="x" data-x>✕</span></div><div class="sub">${J.s}</div>`+
        J.j.map(j=>`<div class="job"><div class="n">${j.n}${j.tag?`<span class="tag">★ ${j.tag}</span>`:''}</div><div class="costs"><span>${'●'.repeat(j.tm)} crew</span>${j.c.map(c=>`<span>${c}</span>`).join('')}${j.out?'<span class="out">OUTSIDE</span>':''}</div><div class="add">+ Add</div></div>`).join('');
      jc.querySelector('[data-x]').onclick=()=>{st.sel=null;render()};
    }else jc.style.display='none';
  }
  render();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
}
const host=document.getElementById('mocks');
for(const s of ['vec','px']){const d=document.createElement('div');d.className='mock';host.appendChild(d);makeMock(d,s)}
</script>
