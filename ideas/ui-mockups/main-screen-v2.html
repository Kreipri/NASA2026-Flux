<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base Screen Drafts v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;0,800;1,800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  .mock { margin: 0 0 22px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; margin:0 0 8px; }
  .bar b { font: 600 14px var(--font-sans, system-ui); color: var(--foreground, #eee); }
  .bar span.note { font: 400 12px var(--font-sans, system-ui); color: var(--muted-foreground, #999); }
  .seg { display:inline-flex; border:1px solid var(--border, #444); border-radius: var(--radius, 8px); overflow:hidden; }
  .seg button { font: 500 12px var(--font-sans, system-ui); padding:5px 10px; border:0; background:transparent; color: var(--muted-foreground, #aaa); cursor:pointer; }
  .seg button.on { background: var(--secondary, #333); color: var(--foreground, #fff); }
  .frame { position:relative; width:100%; aspect-ratio:16/9; border-radius: var(--radius, 8px); overflow:hidden; background:#050810; }
  .stage { position:absolute; left:0; top:0; width:1280px; height:720px; transform-origin:0 0; color:#e6fbff; font-family:'Nunito', system-ui, sans-serif; }
  .stage, .stage * { box-sizing:border-box; }
  .stage canvas.scene { position:absolute; left:0; top:0; width:1280px; height:720px; }
  .stage svg.lines { position:absolute; left:0; top:0; width:1280px; height:720px; pointer-events:none; }
  .ui { position:absolute; }
  .h { font-family:'Exo 2', sans-serif; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
  .panel { background:rgba(6,26,36,.80); border:2px solid rgba(94,224,232,.8); border-radius:16px; box-shadow:0 0 18px rgba(94,224,232,.18); }
  .ic { width:22px; height:22px; display:block; }

  /* day + light (no panel, just type over the sky) */
  .day { left:32px; top:26px; text-shadow:0 2px 12px rgba(0,0,0,.6); }
  .day .t1 { font-family:'Exo 2'; font-style:italic; font-weight:800; font-size:38px; line-height:1; text-transform:uppercase; letter-spacing:.04em; }
  .day .t1 small { font-size:19px; opacity:.7; margin-left:6px; }
  .day .t2 { font-size:15px; opacity:.8; margin-top:4px; font-weight:700; }
  .dots { display:flex; gap:7px; margin-top:10px; align-items:center; }
  .dots i { width:12px; height:12px; border-radius:50%; border:2px solid rgba(94,224,232,.55); display:block; }
  .dots i.past { background:rgba(94,224,232,.55); border-color:transparent; }
  .dots i.now { background:#5ee0e8; border-color:#c9fbff; box-shadow:0 0 10px #5ee0e8; width:16px; height:16px; }
  .dots i.f { border-style:dashed; border-color:#9aa8ff; }
  .chips2 { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .pill { font-size:14px; font-weight:800; padding:5px 12px; border-radius:999px; border:1.5px solid; cursor:pointer; white-space:nowrap; display:inline-flex; gap:6px; align-items:center; background:rgba(6,26,36,.55); }
  .pill.sun { border-color:#ffc24a; color:#ffd98a; }
  .pill.dark { border-color:#9aa8ff; color:#d0d6ff; }
  .pill.star { border-color:rgba(94,224,232,.8); color:#bff8ff; }
  .pill.warn { border-color:#ffc24a; color:#2a1a00; background:#ffc24a; }

  /* round icon buttons */
  .ibtn { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; background:rgba(6,26,36,.7); border:2px solid rgba(94,224,232,.7); color:#bff8ff; }
  .ibtn .dot { position:absolute; right:-3px; top:-3px; width:16px; height:16px; border-radius:50%; background:#ffc24a; border:2px solid #061a24; }

  /* place pins */
  .pin { transform:translate(-50%,-100%); display:flex; align-items:center; gap:0; cursor:pointer; }
  .pin .o { width:36px; height:36px; border-radius:50%; background:rgba(6,26,36,.82); border:2px solid #5ee0e8; display:flex; align-items:center; justify-content:center; color:#9ff6ff; box-shadow:0 0 12px rgba(94,224,232,.35); flex:none; }
  .pin .o .ic { width:20px; height:20px; }
  .pin .nm { position:absolute; left:42px; top:50%; transform:translateY(-50%); white-space:nowrap; font-size:14px; font-weight:800; padding:3px 10px; border-radius:8px; background:rgba(6,26,36,.85); border:1.5px solid rgba(94,224,232,.6); opacity:0; transition:opacity .15s; pointer-events:none; }
  .pin:hover .nm, .pin.sel .nm, .names .pin .nm { opacity:1; }
  .pin.sel .o { background:#5ee0e8; color:#062030; }

  /* job popover */
  .pop { width:310px; padding:14px 16px 10px; display:none; }
  .pop .hd { display:flex; justify-content:space-between; align-items:center; }
  .pop .x { cursor:pointer; opacity:.75; font-size:18px; line-height:1; }
  .pop .sub { font-size:13px; opacity:.8; margin:3px 0 6px; }
  .job { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-top:1px solid rgba(94,224,232,.18); cursor:pointer; }
  .job .n { font-size:15px; font-weight:800; }
  .job .c { font-size:12.5px; opacity:.85; margin-top:2px; }
  .job .c b.out { color:#ffd98a; }
  .job .t { display:flex; gap:3px; flex:none; }
  .job .t i { width:10px; height:10px; border-radius:50%; background:#5ee0e8; display:block; }
  .job .t i.o { background:#ffc24a; }
  .job .tag { font-size:10.5px; padding:1px 6px; border-radius:99px; background:#ffc24a; color:#2a1a00; font-weight:800; margin-left:6px; vertical-align:2px; }

  /* report popover */
  .rep { width:300px; padding:14px 16px; display:none; }
  .rep .r { display:flex; justify-content:space-between; font-size:15px; padding:5px 0; }
  .rep .r span:last-child { color:#ffc24a; letter-spacing:2px; }
  .rep .goal { font-size:13px; opacity:.85; margin-top:6px; }

  /* bot bubble */
  .face { width:84px; height:84px; border-radius:50%; overflow:hidden; border:3px solid #5ee0e8; box-shadow:0 0 18px rgba(94,224,232,.35); background:#0b2a3a; flex:none; }
  .bub { padding:14px 18px 12px; position:relative; }
  .bub .who { position:absolute; left:16px; top:-12px; font-family:'Exo 2'; font-weight:800; font-size:12px; letter-spacing:.08em; background:#5ee0e8; color:#062030; padding:2px 9px; border-radius:6px; }
  .bub p { margin:0; font-size:18px; line-height:1.35; font-weight:700; }
  .bub .tags { display:flex; gap:6px; margin-top:7px; }
  .badge { font-size:11px; font-weight:800; padding:1px 7px; border-radius:6px; white-space:nowrap; }
  .b-arch { border:1.5px solid #ffc24a; color:#ffd98a; }
  .b-ai, .b-sim { border:1.5px dashed rgba(230,251,255,.45); color:rgba(230,251,255,.7); }

  /* end day */
  .endbtn { font-family:'Exo 2'; font-weight:800; letter-spacing:.1em; text-transform:uppercase; font-size:19px; color:#062030; background:linear-gradient(180deg,#7ff0f8,#3cc7d6); border-radius:14px; box-shadow:0 0 18px rgba(94,224,232,.45); text-align:center; cursor:pointer; }
  .crew { display:flex; gap:6px; }
  .crew i { width:18px; height:18px; border-radius:50%; border:2px solid rgba(94,224,232,.5); display:block; }
  .crew i.in { background:#5ee0e8; border-color:#5ee0e8; }
  .crew i.out { background:#ffc24a; border-color:#ffc24a; }

  /* ===== Layout 1: bottom tray ===== */
  .L1 .tray { left:0; right:0; bottom:0; height:150px; background:linear-gradient(180deg, rgba(3,10,18,0), rgba(3,10,18,.86) 42%); }
  .L1 .face { position:absolute; left:28px; bottom:22px; }
  .L1 .bub { position:absolute; left:126px; bottom:26px; width:500px; }
  .L1 .meters { position:absolute; left:660px; bottom:28px; width:330px; display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; }
  .L1 .m { display:grid; grid-template-columns:22px 1fr 30px; gap:8px; align-items:center; }
  .L1 .m .tr { height:9px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden; }
  .L1 .m .tr i { display:block; height:100%; border-radius:99px; }
  .L1 .m .v { font-weight:800; font-size:15px; text-align:right; }
  .L1 .m .lb { grid-column:2 / span 2; font-size:12px; opacity:.7; margin-top:-6px; font-weight:700; }
  .L1 .endw { position:absolute; right:28px; bottom:26px; width:220px; }
  .L1 .endw .crew { justify-content:space-between; margin-bottom:10px; }
  .L1 .endbtn { padding:12px 0; }
  .L1 .tools { right:28px; top:26px; display:flex; gap:10px; }

  /* ===== Layout 2: corners ===== */
  .L2 .gauges { right:28px; top:22px; display:flex; gap:14px; }
  .L2 .g { width:62px; text-align:center; }
  .L2 .g svg { width:62px; height:62px; display:block; }
  .L2 .g .lb { font-size:12px; font-weight:800; opacity:.8; margin-top:3px; }
  .L2 .botl { left:28px; bottom:26px; display:flex; align-items:flex-end; gap:14px; }
  .L2 .bub { width:470px; margin-bottom:6px; }
  .L2 .endw { right:28px; bottom:28px; width:210px; text-align:right; }
  .L2 .endw .lbl { font-size:13px; font-weight:800; opacity:.8; margin-bottom:6px; }
  .L2 .endw .crew { justify-content:flex-end; margin-bottom:10px; }
  .L2 .endbtn { padding:14px 0; }

  /* ===== Layout 3: side rail ===== */
  .L3 .rail { left:18px; top:18px; bottom:18px; width:84px; padding:14px 0; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .L3 .rm { display:flex; flex-direction:column; align-items:center; gap:4px; width:100%; }
  .L3 .rm .vb { width:14px; height:46px; border-radius:99px; background:rgba(255,255,255,.12); position:relative; overflow:hidden; }
  .L3 .rm .vb i { position:absolute; left:0; right:0; bottom:0; border-radius:99px; }
  .L3 .rm .v { font-weight:800; font-size:14px; }
  .L3 .rail hr { width:44px; border:0; border-top:1.5px solid rgba(94,224,232,.3); margin:2px 0; }
  .L3 .rstar { font-weight:800; color:#ffc24a; font-size:15px; text-align:center; cursor:pointer; }
  .L3 .top { left:50%; top:22px; transform:translateX(-50%); display:flex; align-items:center; gap:14px; padding:8px 18px; border-radius:999px; }
  .L3 .top .d { font-family:'Exo 2'; font-weight:800; font-style:italic; font-size:22px; text-transform:uppercase; letter-spacing:.04em; }
  .L3 .top .dots { margin-top:0; }
  .L3 .botc { left:50%; bottom:24px; transform:translateX(-50%); display:flex; align-items:flex-end; gap:12px; }
  .L3 .face { width:72px; height:72px; }
  .L3 .bub { width:520px; margin-bottom:4px; }
  .L3 .ring { right:30px; bottom:24px; width:132px; text-align:center; }
  .L3 .ring .btn { width:132px; height:132px; position:relative; cursor:pointer; }
  .L3 .ring svg { position:absolute; inset:0; }
  .L3 .ring .in { position:absolute; inset:18px; border-radius:50%; background:linear-gradient(180deg,#7ff0f8,#3cc7d6); box-shadow:0 0 18px rgba(94,224,232,.5); display:flex; flex-direction:column; align-items:center; justify-content:center; color:#062030; font-family:'Exo 2'; font-weight:800; text-transform:uppercase; letter-spacing:.08em; font-size:16px; line-height:1.1; }
  .L3 .ring .lbl { font-size:12.5px; font-weight:800; opacity:.8; margin-top:6px; }
</style>
</head>
<body>
<div id="mocks"></div>
<script>

/* ======================= math + scene ======================= */
const W = 1280, H = 720, D2R = Math.PI / 180;
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
      mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
      cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
      norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]};
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const dirAE=(az,el)=>[Math.sin(az*D2R)*Math.cos(el*D2R), Math.sin(el*D2R), Math.cos(az*D2R)*Math.cos(el*D2R)];

// Sun drawn at 4 deg (real polar max is about 1.5 deg) so shapes read; Earth low in the sky.
const SUN_AZ = -30, SUN = dirAE(SUN_AZ, 4), SUN_DOWN = dirAE(SUN_AZ, -2), EARTH = dirAE(0, 8);

const VIEWS = {
  low:  { tx:-8.7, ty:3, tz:42.6, dist:38, pitch:0,  yaw:-17, fov:40, name:'Low (like ref)' },
  high: { tx:-7.5, ty:0, tz:44.6, dist:58, pitch:13, yaw:-17, fov:50, name:'High 3/4' },
  wide: { tx:-5.5, ty:0, tz:74.7, dist:112, pitch:7, yaw:-19, fov:34, name:'Wide' },
};
function camFrom(v){
  const p=v.pitch*D2R, y=v.yaw*D2R;
  const f=[Math.sin(y)*Math.cos(p), -Math.sin(p), Math.cos(y)*Math.cos(p)];
  const r=[Math.cos(y),0,-Math.sin(y)];
  const u=cross(f,r);
  const C=[v.tx-f[0]*v.dist, v.ty-f[1]*v.dist, v.tz-f[2]*v.dist];
  return {C,f,r,u,F:(H/2)/Math.tan(v.fov*D2R/2),v};
}
const toCam=(cam,P)=>{const d=sub(P,cam.C);return [dot(d,cam.r),dot(d,cam.u),dot(d,cam.f)]};
const proj=(cam,c)=>[W/2+c[0]/c[2]*cam.F, H/2-c[1]/c[2]*cam.F];
function projDir(cam,d){const x=dot(d,cam.r),y=dot(d,cam.u),z=dot(d,cam.f);if(z<=0.01)return null;return [W/2+x/z*cam.F,H/2-y/z*cam.F]}
function projPt(cam,P){const c=toCam(cam,P);if(c[2]<0.5)return null;return proj(cam,c)}
function clipNear(poly,n=0.5){const o=[];for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],ai=a[2]>=n,bi=b[2]>=n;if(ai)o.push(a);if(ai!==bi){const t=(n-a[2])/(b[2]-a[2]);o.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,n])}}return o}
function pathWorld(ctx,cam,pts){const c=clipNear(pts.map(p=>toCam(cam,p)));if(c.length<3)return false;ctx.beginPath();c.forEach((q,i)=>{const s=proj(cam,q);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1])});ctx.closePath();return true}

function mkFace(p,col,o={}){let n=[0,0,0];for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];n[0]+=(a[1]-b[1])*(a[2]+b[2]);n[1]+=(a[2]-b[2])*(a[0]+b[0]);n[2]+=(a[0]-b[0])*(a[1]+b[1])}
  const c=mul(p.reduce((s,q)=>add(s,q),[0,0,0]),1/p.length);return Object.assign({p,n:norm(n),c,col},o)}
function orient(fs,ctr){fs.forEach(f=>{if(!f.two&&dot(f.n,sub(f.c,ctr))<0)f.n=mul(f.n,-1)});return fs}
const rotY=(x,z,t)=>[x*Math.cos(t)+z*Math.sin(t), -x*Math.sin(t)+z*Math.cos(t)];

function box(c,s,col,yaw=0,o={}){const t=yaw*D2R,P=(x,y,z)=>{const r=rotY(x,z,t);return [c[0]+r[0],c[1]+y,c[2]+r[1]]};
  const [a,b,d]=[s[0]/2,s[1],s[2]/2];const v=[P(-a,0,-d),P(a,0,-d),P(a,0,d),P(-a,0,d),P(-a,b,-d),P(a,b,-d),P(a,b,d),P(-a,b,d)];
  const fs=[[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7],[4,5,6,7],[0,3,2,1]].map(q=>mkFace(q.map(i=>v[i]),col,o));
  return orient(fs,[c[0],c[1]+b/2,c[2]])}
function cylX(c,len,r,n,col,yaw=0){const t=yaw*D2R,P=(x,y,z)=>{const q=rotY(x,z,t);return [c[0]+q[0],c[1]+y,c[2]+q[1]]};const fs=[],A=[],B=[];
  for(let i=0;i<n;i++){const a=i/n*2*Math.PI;A.push(P(-len/2,r*Math.sin(a),-r*Math.cos(a)));B.push(P(len/2,r*Math.sin(a),-r*Math.cos(a)))}
  for(let i=0;i<n;i++){const j=(i+1)%n;fs.push(mkFace([A[i],A[j],B[j],B[i]],col))}
  fs.push(mkFace(A.slice(),col),mkFace(B.slice(),col));return orient(fs,c)}
function dome(c,rx,h,rz,col,nu=18,nv=5,seed=3){const R=rng(seed),j=[];for(let i=0;i<nu;i++)j.push(1+(R()-.5)*.14);const rows=[];
  for(let v=0;v<=nv;v++){const ph=v/nv*Math.PI/2,row=[];for(let u=0;u<nu;u++){const a=u/nu*2*Math.PI,k=Math.cos(ph)*(v<nv?j[u]:1);row.push([c[0]+rx*k*Math.cos(a),h*Math.sin(ph)*(v>0&&v<nv?j[(u+2)%nu]:1),c[2]+rz*k*Math.sin(a)])}rows.push(row)}
  const fs=[];for(let v=0;v<nv;v++)for(let u=0;u<nu;u++){const w=(u+1)%nu;if(v===nv-1)fs.push(mkFace([rows[v][u],rows[v][w],rows[v+1][0]],col));else fs.push(mkFace([rows[v][u],rows[v][w],rows[v+1][w],rows[v+1][u]],col))}
  return orient(fs,[c[0],h*0.3,c[2]])}
function rock(c,s,R){const b=[];for(let i=0;i<4;i++){const a=i/4*2*Math.PI+R()*.8;b.push([c[0]+Math.cos(a)*s*(.7+R()*.5),0,c[2]+Math.sin(a)*s*(.7+R()*.5)])}
  const ap=[c[0]+(R()-.5)*s*.6,s*(.5+R()*.6),c[2]+(R()-.5)*s*.6];const g=150+R()*40;
  return orient(b.map((q,i)=>mkFace([q,b[(i+1)%4],ap],[g,g-4,g-10])),[c[0],s*.25,c[2]])}
function disk(ctr,n,r,k,col){const a=Math.abs(n[1])<.9?[0,1,0]:[1,0,0],e1=norm(cross(n,a)),e2=cross(n,e1),p=[];
  for(let i=0;i<k;i++){const t=i/k*2*Math.PI;p.push(add(ctr,add(mul(e1,Math.cos(t)*r),mul(e2,Math.sin(t)*r))))}return [mkFace(p,col,{two:true})]}

/* ---- the base ---- */
const WHITE=[232,236,240], ORANGE=[240,140,60], REG=[150,143,135], DARKP=[70,78,92], CELL=[40,70,140], WIN=[255,205,120];
const HAB={x:-2,z:40,r:2.3,len:10,cy:2.9}, SHEL={x:-15,z:46}, ROVER={x:7,z:37,yaw:20}, CRATER={x:20,z:122,R:24};
const PANEL_YAW = Math.atan2(SUN[0],SUN[2])/D2R;
const MASTS=[[-21,58],[-16.5,60],[-12,62]];
function buildScene(){
  const objs=[], glows=[];
  // habitat
  const hf=cylX([HAB.x,HAB.cy,HAB.z],HAB.len,HAB.r,16,WHITE);
  for(const lx of [-4.4,-2,0.4]){for(const [y0,y1] of [[-6,22]]){}
    const p=[];const rr=HAB.r*1.03;
    const pt=(x,a)=>[HAB.x+x,HAB.cy+rr*Math.sin(a*D2R),HAB.z-rr*Math.cos(a*D2R)];
    p.push(pt(lx-.5,-4),pt(lx+.5,-4),pt(lx+.5,24),pt(lx-.5,24));hf.push(mkFace(p,WIN,{emis:true,decal:true}));glows.push([HAB.x+lx,HAB.cy+1,HAB.z-HAB.r-.3])}
  // orange band
  for(const bx of [-4.9,4.9]){const p=[];const rr=HAB.r*1.02;for(const a of [-80,80]){}}
  objs.push({f:hf,ctr:[HAB.x,HAB.cy,HAB.z]});
  for(const lx of [-4,0,4])for(const lz of [-1.4,1.4])objs.push({f:box([HAB.x+lx,0,HAB.z+lz],[.25,HAB.cy-HAB.r+.2,.25],DARKP),ctr:[HAB.x+lx,.3,HAB.z+lz]});
  // airlock + door
  const al=box([HAB.x+HAB.len/2+1,0.2,HAB.z],[2,3.4,2.4],[220,224,228]);
  al.push(mkFace([[HAB.x+HAB.len/2+.6,.6,HAB.z-1.22],[HAB.x+HAB.len/2+1.4,.6,HAB.z-1.22],[HAB.x+HAB.len/2+1.4,2.6,HAB.z-1.22],[HAB.x+HAB.len/2+.6,2.6,HAB.z-1.22]],ORANGE,{decal:true}));
  objs.push({f:al,ctr:[HAB.x+HAB.len/2+1,1.5,HAB.z]});
  // shelter mound (regolith over a buried module) + entry

  solar:{t:'Solar arrays',s:'Tall panels turn to follow the low Sun.',j:[{n:'Log sunlight & shadows',tm:1,c:'⚡ −2',tag:'LIGHT'},{n:'Clean dust off panels',tm:2,c:'O₂ −2 · dose +1',out:1},{n:'Repair a fault',tm:2,c:'⚡ −10'}]},
  hab:{t:'Habitat',s:'Home for the crew of 4.',j:[{n:'Tune the air system',tm:1,c:'⚡ −20 · O₂ +30'},{n:'Measure radiation',tm:1,c:'⚡ −4',tag:'RADIATION'},{n:'Power-saving mode',tm:1,c:'stamina −10 · base uses half power'},{n:'Rest (2 crew)',tm:2,c:'O₂ −1 · stamina +20'}]},
  shelter:{t:'Shelter',s:'Moon soil blocks space radiation.',j:[{n:'Pile soil on shelter',tm:4,c:'⚡ −10 · O₂ −4 · dose +2',out:1,tag:'SHELTER'},{n:'Shelter during peak',tm:4,c:'⚡ +5 · storm days only',tag:'SHELTER'}]},
  rover:{t:'Rover & drone',s:'The dark crater is never sunlit and as cold as −414°F. Ice may hide there.',j:[{n:'Scout with hop-drone',tm:1,c:'⚡ −15 · maps the crater',tag:'ICE'},{n:'Rover to dark crater',tm:4,c:'⚡ −50 · O₂ −8 · dose +4',out:1,tag:'ICE'}]},
  crater:{t:'Dark crater',s:'Never sunlit. As cold as −414°F.',j:[{n:'Rover to dark crater',tm:4,c:'⚡ −50 · O₂ −8 · dose +4',out:1,tag:'ICE'}]},
  earth:{t:'Earth link',s:'Radio to Mission Control.',j:[{n:'Call Mission Control',tm:1,c:'⚡ −5 · 2-day storm forecast'}]},
};
const PINS={
  solar:{lab:'Solar arrays',ic:'solar',a:()=>[MASTS[1][0],13.2,MASTS[1][1]]},
  hab:{lab:'Habitat',ic:'hab',a:()=>[HAB.x+1,HAB.cy+HAB.r+.2,HAB.z]},
  shelter:{lab:'Shelter',ic:'shield',a:()=>[SHEL.x,3.5,SHEL.z]},
  rover:{lab:'Rover · crater trips',ic:'rover',a:()=>[ROVER.x,2.4,ROVER.z]},
  earth:{lab:'Earth link',ic:'dish',dir:EARTH},
};
const METERS=sun=>[['bolt','Power',sun?72:38,'#ffd34d'],['o2','Oxygen',61,'#7fe3ff'],['dose','Dose',18,'#c59bff'],['heart','Stamina',74,'#ff7b8f']];
const ic=(k,col)=>VIC[k].replace('<svg','<svg style="color:'+(col||'currentColor')+'"');
const dots=(now,sun)=>Array.from({length:7},(_,i)=>`<i class="${i<now-1?'past':i===now-1?'now':''} ${(i===4||i===5)&&sun?'f':''}"></i>`).join('');
const say=sun=>sun?'A big solar flare just went off. A particle storm may reach us tomorrow!':'The Sun is behind the hills for 2 days, and Earth has set. Save power!';
const tags=sun=>sun?'<span class="badge b-arch">✓ NASA DONKI · ARCHIVE</span><span class="badge b-ai">AI story</span>':'<span class="badge b-sim">~ SIMULATED</span><span class="badge b-ai">AI story</span>';
const bubble=sun=>`<div class="bub panel"><div class="who">BASE BOT</div><p>${say(sun)}</p><div class="tags">${tags(sun)}</div></div>`;
const lightPill=sun=>sun?`<span class="pill sun">☀ Sunlight</span>`:`<span class="pill dark">◐ Long shadow · no Earth link</span>`;
const starPill=`<span class="pill star" data-rep>★ 3 / 12</span>`;
const crewChips=`<div class="crew">${['out','out','out','out','in','','',''].map(c=>`<i class="${c}"></i>`).join('')}</div>`;

const LAYOUTS={
  L1:{name:'1 · Bottom tray', note:'everything you touch lives in one strip; the sky stays empty',
    html:sun=>`
      <div class="ui day"><div class="t1">Day ${sun?2:5}<small>of 7</small></div><div class="dots">${dots(sun?2:5,sun)}</div><div class="chips2">${lightPill(sun)}${starPill}</div></div>
      <div class="ui tools"><div class="ibtn">${ic('sunw','#ffc24a')}${sun?'<span class="dot"></span>':''}</div><div class="ibtn">${ic('help')}</div><div class="ibtn">${ic('gear')}</div></div>
      <div class="ui tray">
        <div class="face">${ROBOT_SVG}</div>${bubble(sun)}
        <div class="meters">${METERS(sun).map(([k,n,v,c])=>`<div class="m">${ic(k,c)}<div class="tr"><i style="width:${v}%;background:${c}"></i></div><span class="v">${v}</span><span></span><span class="lb">${n}</span></div>`).join('')}</div>
        <div class="endw">${crewChips}<div class="endbtn">End day ▶</div></div>
      </div>`,
    pop:{rep:[28,170]}},
  L2:{name:'2 · Corners', note:'four quiet corners, the middle is all scene',
    html:sun=>`
      <div class="ui day"><div class="t1">Day ${sun?2:5}<small>of 7</small></div><div class="t2">Shackleton Ridge</div><div class="chips2">${lightPill(sun)}${starPill}<span class="pill star">${ic('sunw','#ffc24a').replace('class="ic"','class="ic" style="width:16px;height:16px;color:#ffc24a"')} SunWatch${sun?' !':''}</span></div></div>
      <div class="ui gauges">${METERS(sun).map(([k,n,v,c])=>{const r=25,C=2*Math.PI*r;return `<div class="g"><svg viewBox="0 0 62 62"><circle cx="31" cy="31" r="${r}" fill="rgba(6,26,36,.75)" stroke="rgba(255,255,255,.12)" stroke-width="6"/><circle cx="31" cy="31" r="${r}" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C*v/100} ${C}" transform="rotate(-90 31 31)"/><foreignObject x="19" y="12" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="color:${c}">${VIC[k]}</div></foreignObject><text x="31" y="47" text-anchor="middle" font-size="11" font-weight="800" fill="#e6fbff" font-family="Nunito">${v}</text></svg><div class="lb">${n}</div></div>`}).join('')}</div>
      <div class="ui botl"><div class="face">${ROBOT_SVG}</div>${bubble(sun)}</div>
      <div class="ui endw"><div class="lbl">Crew time · 5 of 8 planned</div>${crewChips}<div class="endbtn">End day ▶</div></div>`,
    pop:{rep:[28,190]}},
  L3:{name:'3 · Side rail', note:'meters live in a slim rail; End day is a ring that fills with crew time',
    html:sun=>{const segs=['#ffc24a','#ffc24a','#ffc24a','#ffc24a','#5ee0e8','rgba(94,224,232,.25)','rgba(94,224,232,.25)','rgba(94,224,232,.25)'];
      const arc=(i)=>{const a0=(i*45+3-90)*D2R,a1=((i+1)*45-3-90)*D2R,r=60,c=66;return `<path d="M${c+r*Math.cos(a0)} ${c+r*Math.sin(a0)}A${r} ${r} 0 0 1 ${c+r*Math.cos(a1)} ${c+r*Math.sin(a1)}" stroke="${segs[i]}" stroke-width="9" fill="none" stroke-linecap="round"/>`};
      return `
      <div class="ui rail panel">${METERS(sun).map(([k,n,v,c])=>`<div class="rm" title="${n}">${ic(k,c)}<div class="vb"><i style="height:${v}%;background:${c}"></i></div><span class="v">${v}</span></div>`).join('')}
        <hr><div class="rstar" data-rep>★<br>3/12</div><hr><div class="ibtn">${ic('sunw','#ffc24a')}${sun?'<span class="dot"></span>':''}</div><div class="ibtn">${ic('help')}</div></div>
      <div class="ui top panel"><span class="d">Day ${sun?2:5} <small style="font-size:14px;opacity:.7">of 7</small></span><div class="dots">${dots(sun?2:5,sun)}</div>${lightPill(sun)}</div>
      <div class="ui botc"><div class="face">${ROBOT_SVG}</div>${bubble(sun)}</div>
      <div class="ui ring"><div class="btn"><svg viewBox="0 0 132 132">${segs.map((_,i)=>arc(i)).join('')}</svg><div class="in">End<br>day ▶</div></div><div class="lbl">5 of 8 crew time</div></div>`},
    pop:{rep:[118,300]}},
};

function makeMock(root, key){
  const L=LAYOUTS[key], st={view:'low', light:'sun', sel:null, rep:false};
  root.innerHTML=`<div class="bar"><b>${L.name}</b><span class="note">${L.note}</span>
    <div class="seg" data-k="light"><button data-v="sun">Day 2 · Sunlight</button><button data-v="dark">Day 5 · Long shadow</button></div></div>
    <div class="frame ${key}"><div class="stage"><canvas class="scene"></canvas><svg class="lines" viewBox="0 0 1280 720"></svg>
      <div data-hud></div><div data-pins></div><div class="ui pop panel" data-pop></div><div class="ui rep panel" data-repc></div></div></div>`;
  const frame=root.querySelector('.frame'), stage=root.querySelector('.stage'), cv=root.querySelector('canvas.scene');
  const fit=()=>{stage.style.transform=`scale(${frame.clientWidth/1280})`};new ResizeObserver(fit).observe(frame);fit();
  root.querySelector('.seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.light=b.dataset.v;st.sel=null;render()});
  function render(){
    const sun=st.light==='sun';
    root.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===st.light));
    const dpr=Math.min(2,window.devicePixelRatio||1)*Math.max(.6,frame.clientWidth/1280);cv.width=Math.round(1280*dpr);cv.height=Math.round(720*dpr);
    const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);const cam=drawScene(c,st,false);
    root.querySelector('[data-hud]').innerHTML=L.html(sun);
    root.querySelectorAll('[data-rep]').forEach(el=>el.onclick=()=>{st.rep=!st.rep;st.sel=null;render()});
    // pins
    let html='',lines='';const pos={};
    for(const [k,p] of Object.entries(PINS)){
      if(k==='earth'&&!sun)continue;
      const s=p.dir?projDir(cam,p.dir):projPt(cam,p.a());if(!s)continue;
      const up=k==='earth'?34:30, py=s[1]-up; pos[k]=[s[0],py];
      html+=`<div class="ui pin ${st.sel===k?'sel':''}" data-p="${k}" style="left:${s[0]}px;top:${py}px"><div class="o">${ic(p.ic)}</div><div class="nm">${p.lab}</div></div>`;
      const y2=k==='earth'?py:py;lines+=`<line x1="${s[0]}" y1="${k==='earth'?s[1]-20:s[1]}" x2="${s[0]}" y2="${y2}" stroke="#5ee0e8" stroke-width="2" opacity=".6"/>${k==='earth'?'':`<circle cx="${s[0]}" cy="${s[1]}" r="3.5" fill="#5ee0e8"/>`}`;
    }
    root.querySelector('[data-pins]').innerHTML=html;root.querySelector('svg.lines').innerHTML=lines;
    root.querySelectorAll('.pin').forEach(el=>el.onclick=()=>{st.sel=st.sel===el.dataset.p?null:el.dataset.p;st.rep=false;render()});
    // job popover next to the tapped pin
    const pop=root.querySelector('[data-pop]');
    if(st.sel){const J=JOBS[st.sel];pop.style.display='block';
      pop.innerHTML=`<div class="hd"><span class="h" style="font-size:15px">${J.t}</span><span class="x">✕</span></div><div class="sub">${J.s}</div>`+
        J.j.map(j=>`<div class="job"><div><div class="n">${j.n}${j.tag?`<span class="tag">★ ${j.tag}</span>`:''}</div><div class="c">${j.c}${j.out?' · <b class="out">outside</b>':''}</div></div><div class="t">${Array.from({length:j.tm},()=>`<i class="${j.out?'o':''}"></i>`).join('')}</div></div>`).join('');
      const [x,y]=pos[st.sel];let left=x+30,top=y-60;const h=pop.offsetHeight;if(left+310>1250)left=x-340;top=Math.max(90,Math.min(top,560-h));pop.style.left=left+'px';pop.style.top=top+'px';
      pop.querySelector('.x').onclick=()=>{st.sel=null;render()};
    }else pop.style.display='none';
    // report card popover (main goal first, then 2 bonus goals; D-021)
    const rep=root.querySelector('[data-repc]');
    if(st.rep){rep.style.display='block';rep.style.left=L.pop.rep[0]+'px';rep.style.top=L.pop.rep[1]+'px';
      rep.innerHTML=`<div class="hd" style="display:flex;justify-content:space-between"><span class="h" style="font-size:15px">Site report</span><span class="x" style="cursor:pointer">✕</span></div>`+
        [['Light',2],['Radiation',1],['Shelter',0],['Ice',0]].map(([n,s])=>`<div class="r"><span>${n}</span><span>${'★'.repeat(s)}${'☆'.repeat(3-s)}</span></div>`).join('')+
        `<div class="goal">Goal: SITE APPROVED = 11 stars, a star on every question, crew healthy.</div>`;
      rep.querySelector('.x').onclick=()=>{st.rep=false;render()};
    }else rep.style.display='none';
  }
  render();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
}
const host=document.getElementById('mocks');
for(const k of Object.keys(LAYOUTS)){const d=document.createElement('div');d.className='mock';host.appendChild(d);makeMock(d,k)}
</script>
</body>
</html>
