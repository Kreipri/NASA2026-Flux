/* ---------- navigation ---------- */
const nav=document.getElementById('nav');const groups=[...new Set(SCREENS.map(s=>s.g))];
nav.innerHTML=groups.map(g=>`<div class="navrow"><span class="g">${g}</span>${SCREENS.filter(s=>s.g===g).map(s=>`<button data-id="${s.id}">${s.name}</button>`).join('')}</div>`).join('');
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.id)});
stage.addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(t)go(t.dataset.go)});
document.getElementById('prev').onclick=()=>{const i=SCREENS.findIndex(s=>s.id===cur.id);go(SCREENS[(i-1+SCREENS.length)%SCREENS.length].id)};
document.getElementById('next').onclick=()=>{const i=SCREENS.findIndex(s=>s.id===cur.id);go(SCREENS[(i+1)%SCREENS.length].id)};

let cur=null,anim=null,lightMode=null;
function setLight(m){if(m===lightMode)return;lightMode=m;const L=LIGHT[m],up=m==='sun';terrainMat.uniforms.sunD.value.set(...L);sun.position.copy(W(L[0]*1500,L[1]*1500,L[2]*1500));sun.target.position.set(0,0,0);sun.intensity=up?2.1:0;hemi.intensity=up?.75:.35;lamps.forEach(l=>l.intensity=up?30:160)}
function go(id,instant){const S=SCREENS.find(s=>s.id===id);cur=S;
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));document.getElementById('note').innerHTML=S.note;
  setLight(S.dark?'dark':'sun');lines.visible=!!S.lines;route.visible=!!S.route;scene.traverse(o=>{if(o.isSprite)o.visible=!S.dark;if(o.material&&o.material.isShadowMaterial)o.visible=['base','solar','hab','shelter','sky'].includes(S.cam)});
  const C=CAMS[S.cam];controls.autoRotate=!!C.orbit;
  if(instant){camera.position.copy(C.pos);controls.target.copy(C.tgt);camera.fov=C.fov;camera.updateProjectionMatrix()}
  else if(!anim||anim.C!==C){const far=camera.position.distanceTo(C.pos);anim={t0:performance.now(),dur:far<50?10:Math.min(2200,900+far*.05),p0:camera.position.clone(),q0:controls.target.clone(),f0:camera.fov,C,arc:Math.min(1500,far*.08)}}
  let h='';if(S.art)h+=`<div class="artl">${S.art()}</div>`;if(S.dim)h+='<div class="dim"></div>';
  if(S.pins)for(const [k,p] of Object.entries(PINS))if(!(S.dark&&k==='earth'))h+=`<div class="pin ${S.sel===k?'sel':''} ${S.ring===k?'ring':''} ${S.id==='tutorial'&&!['hab','shelter'].includes(k)?'faded':''} click" data-pin="${k}" data-go="${k==='shelter'?'jobs':S.id}"><div class="o">${p.ic}</div><div class="stem"></div>${S.sel===k||S.ring===k?`<div class="nm">${p.nm}</div>`:''}</div>`;
  for(const k of (S.labs||[]))h+=`<div class="lab3 ${L3[k].warm?'warm':''}" data-lab="${k}"><div class="box"><div class="t">${L3[k].t}</div><div class="s">${L3[k].s}</div></div><div class="stem"></div><div class="dt"></div></div>`;
  stage.innerHTML=h+S.html();}

/* ---------- render loop ---------- */
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1280,720),.35,.4,.95));composer.addPass(new OutputPass());
function resize(){const w=frame.clientWidth||728,h=Math.round(w*9/16);renderer.setSize(w,h,false);composer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();stage.style.transform=`scale(${w/1280})`}
new ResizeObserver(resize).observe(frame);resize();
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,v3=new THREE.Vector3();
const toStage=p=>{v3.copy(p).project(camera);return v3.z>1?null:[(v3.x+1)/2*1280,(1-v3.y)/2*720]};
function tick(now){
  if(anim){const t=Math.min(1,(now-anim.t0)/anim.dur),k=ease(t);camera.position.lerpVectors(anim.p0,anim.C.pos,k);camera.position.y+=Math.sin(k*Math.PI)*anim.arc;controls.target.lerpVectors(anim.q0,anim.C.tgt,k);camera.fov=anim.f0+(anim.C.fov-anim.f0)*k;camera.updateProjectionMatrix();if(t>=1)anim=null}
  controls.update();if(!cur.art)composer.render();
  stage.querySelectorAll('[data-pin]').forEach(el=>{const s=toStage(PINS[el.dataset.pin].p);if(!s){el.style.display='none';return}el.style.display='flex';el.style.left=s[0]+'px';el.style.top=s[1]+'px'});
  stage.querySelectorAll('[data-lab]').forEach(el=>{const s=toStage(L3[el.dataset.lab].p());if(!s||s[0]<0||s[0]>1280||s[1]<0||s[1]>720){el.style.display='none';return}el.style.display='block';el.style.left=s[0]+'px';el.style.top=s[1]+'px'});
  stage.querySelectorAll('[data-anchor]').forEach(el=>{const s=toStage(PINS[el.dataset.anchor].p);if(!s)return;el.style.left=Math.max(10,Math.min(1280-340,s[0]+ +el.dataset.dx))+'px';el.style.top=Math.max(10,s[1]+ +el.dataset.dy)+'px'});
  requestAnimationFrame(tick)}
go(/*START*/'title',true);requestAnimationFrame(tick);
</script>
