<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ridge Long Lens</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; margin:0 0 8px; }
  .seg { display:inline-flex; border:1px solid var(--border, #444); border-radius: var(--radius, 8px); overflow:hidden; }
  .seg button { font: 500 12px var(--font-sans, system-ui); padding:6px 10px; border:0; background:transparent; color: var(--muted-foreground, #aaa); cursor:pointer; }
  .seg button.on { background: var(--secondary, #333); color: var(--foreground, #fff); }
  .frame { position:relative; width:100%; aspect-ratio:16/9; border-radius: var(--radius, 8px); overflow:hidden; background:#03050c; }
  .frame canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .desc { font: 13px/1.5 var(--font-sans, system-ui); color: var(--muted-foreground, #aaa); margin:8px 2px 0; }
  .qa h3 { font: 600 14px var(--font-sans, system-ui); color: var(--foreground,#eee); margin:16px 0 6px; }
</style>
</head>
<body>
<div id="app"></div>
<script>

/* ======================= math + scene ======================= */
const W = 1280, H = 720, D2R = Math.PI / 180;
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
      mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
      cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
      norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]};
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const dirAE=(az,el)=>[Math.sin(az*D2R)*Math.cos(el*D2R), Math.sin(el*D2R), Math.cos(az*D2R)*Math.cos(el*D2R)];

// Sun drawn at 4 deg (real polar max is about 1.5 deg) so shapes read; Earth low in the sky.
const SUN_AZ = -30, SUN = dirAE(SUN_AZ, 4), SUN_DOWN = dirAE(SUN_AZ, -2), EARTH = dirAE(0, 8);

const VIEWS = {
  low:  { tx:-8.7, ty:3, tz:42.6, dist:38, pitch:0,  yaw:-17, fov:40, name:'Low (like ref)' },
  high: { tx:-7.5, ty:0, tz:44.6, dist:58, pitch:13, yaw:-17, fov:50, name:'High 3/4' },
  wide: { tx:-5.5, ty:0, tz:74.7, dist:112, pitch:7, yaw:-19, fov:34, name:'Wide' },
};
function camFrom(v){
  const p=v.pitch*D2R, y=v.yaw*D2R;
  const f=[Math.sin(y)*Math.cos(p), -Math.sin(p), Math.cos(y)*Math.cos(p)];
  const r=[Math.cos(y),0,-Math.sin(y)];
  const u=cross(f,r);
  const C=[v.tx-f[0]*v.dist, v.ty-f[1]*v.dist, v.tz-f[2]*v.dist];
  return {C,f,r,u,F:(H/2)/Math.tan(v.fov*D2R/2),v};
}
const toCam=(cam,P)=>{const d=sub(P,cam.C);return [dot(d,cam.r),dot(d,cam.u),dot(d,cam.f)]};
const proj=(cam,c)=>[W/2+c[0]/c[2]*cam.F, H/2-c[1]/c[2]*cam.F];
function projDir(cam,d){const x=dot(d,cam.r),y=dot(d,cam.u),z=dot(d,cam.f);if(z<=0.01)return null;return [W/2+x/z*cam.F,H/2-y/z*cam.F]}
function projPt(cam,P){const c=toCam(cam,P);if(c[2]<0.5)return null;return proj(cam,c)}
function clipNear(poly,n=0.5){const o=[];for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],ai=a[2]>=n,bi=b[2]>=n;if(ai)o.push(a);if(ai!==bi){const t=(n-a[2])/(b[2]-a[2]);o.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,n])}}return o}
function pathWorld(ctx,cam,pts){const c=clipNear(pts.map(p=>toCam(cam,p)));if(c.length<3)return false;ctx.beginPath();c.forEach((q,i)=>{const s=proj(cam,q);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1])});ctx.closePath();return true}

function mkFace(p,col,o={}){let n=[0,0,0];for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];n[0]+=(a[1]-b[1])*(a[2]+b[2]);n[1]+=(a[2]-b[2])*(a[0]+b[0]);n[2]+=(a[0]-b[0])*(a[1]+b[1])}
  const c=mul(p.reduce((s,q)=>add(s,q),[0,0,0]),1/p.length);return Object.assign({p,n:norm(n),c,col},o)}
function orient(fs,ctr){fs.forEach(f=>{if(!f.two&&dot(f.n,sub(f.c,ctr))<0)f.n=mul(f.n,-1)});return fs}
const rotY=(x,z,t)=>[x*Math.cos(t)+z*Math.sin(t), -x*Math.sin(t)+z*Math.cos(t)];

function box(c,s,col,yaw=0,o={}){const t=yaw*D2R,P=(x,y,z)=>{const r=rotY(x,z,t);return [c[0]+r[0],c[1]+y,c[2]+r[1]]};
  const [a,b,d]=[s[0]/2,s[1],s[2]/2];const v=[P(-a,0,-d),P(a,0,-d),P(a,0,d),P(-a,0,d),P(-a,b,-d),P(a,b,-d),P(a,b,d),P(-a,b,d)];
  const fs=[[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7],[4,5,6,7],[0,3,2,1]].map(q=>mkFace(q.map(i=>v[i]),col,o));
  return orient(fs,[c[0],c[1]+b/2,c[2]])}
function cylX(c,len,r,n,col,yaw=0){const t=yaw*D2R,P=(x,y,z)=>{const q=rotY(x,z,t);return [c[0]+q[0],c[1]+y,c[2]+q[1]]};const fs=[],A=[],B=[];
  for(let i=0;i<n;i++){const a=i/n*2*Math.PI;A.push(P(-len/2,r*Math.sin(a),-r*Math.cos(a)));B.push(P(len/2,r*Math.sin(a),-r*Math.cos(a)))}
  for(let i=0;i<n;i++){const j=(i+1)%n;fs.push(mkFace([A[i],A[j],B[j],B[i]],col))}
  fs.push(mkFace(A.slice(),col),mkFace(B.slice(),col));return orient(fs,c)}
function dome(c,rx,h,rz,col,nu=18,nv=5,seed=3){const R=rng(seed),j=[];for(let i=0;i<nu;i++)j.push(1+(R()-.5)*.14);const rows=[];
  for(let v=0;v<=nv;v++){const ph=v/nv*Math.PI/2,row=[];for(let u=0;u<nu;u++){const a=u/nu*2*Math.PI,k=Math.cos(ph)*(v<nv?j[u]:1);row.push([c[0]+rx*k*Math.cos(a),h*Math.sin(ph)*(v>0&&v<nv?j[(u+2)%nu]:1),c[2]+rz*k*Math.sin(a)])}rows.push(row)}
  const fs=[];for(let v=0;v<nv;v++)for(let u=0;u<nu;u++){const w=(u+1)%nu;if(v===nv-1)fs.push(mkFace([rows[v][u],rows[v][w],rows[v+1][0]],col));else fs.push(mkFace([rows[v][u],rows[v][w],rows[v+1][w],rows[v+1][u]],col))}
  return orient(fs,[c[0],h*0.3,c[2]])}
function rock(c,s,R){const b=[];for(let i=0;i<4;i++){const a=i/4*2*Math.PI+R()*.8;b.push([c[0]+Math.cos(a)*s*(.7+R()*.5),0,c[2]+Math.sin(a)*s*(.7+R()*.5)])}
  const ap=[c[0]+(R()-.5)*s*.6,s*(.5+R()*.6),c[2]+(R()-.5)*s*.6];const g=150+R()*40;
  return orient(b.map((q,i)=>mkFace([q,b[(i+1)%4],ap],[g,g-4,g-10])),[c[0],s*.25,c[2]])}
function disk(ctr,n,r,k,col){const a=Math.abs(n[1])<.9?[0,1,0]:[1,0,0],e1=norm(cross(n,a)),e2=cross(n,e1),p=[];
  for(let i=0;i<k;i++){const t=i/k*2*Math.PI;p.push(add(ctr,add(mul(e1,Math.cos(t)*r),mul(e2,Math.sin(t)*r))))}return [mkFace(p,col,{two:true})]}

/* ---- the base ---- */
const WHITE=[232,236,240], ORANGE=[240,140,60], REG=[150,143,135], DARKP=[70,78,92], CELL=[40,70,140], WIN=[255,205,120];
const HAB={x:-2,z:40,r:2.3,len:10,cy:2.9}, SHEL={x:-15,z:46}, ROVER={x:7,z:37,yaw:20}, CRATER={x:20,z:122,R:24};
const PANEL_YAW = Math.atan2(SUN[0],SUN[2])/D2R;
const MASTS=[[-21,58],[-16.5,60],[-12,62]];
function buildScene(){
  const objs=[], glows=[];
  // habitat
  const hf=cylX([HAB.x,HAB.cy,HAB.z],HAB.len,HAB.r,16,WHITE);
  for(const lx of [-4.4,-2,0.4]){for(const [y0,y1] of [[-6,22]]){}
    const p=[];const rr=HAB.r*1.03;
    const pt=(x,a)=>[HAB.x+x,HAB.cy+rr*Math.sin(a*D2R),HAB.z-rr*Math.cos(a*D2R)];
    p.push(pt(lx-.5,-4),pt(lx+.5,-4),pt(lx+.5,24),pt(lx-.5,24));hf.push(mkFace(p,WIN,{emis:true,decal:true}));glows.push([HAB.x+lx,HAB.cy+1,HAB.z-HAB.r-.3])}
  // orange band
  for(const bx of [-4.9,4.9]){const p=[];const rr=HAB.r*1.02;for(const a of [-80,80]){}}
  objs.push({f:hf,ctr:[HAB.x,HAB.cy,HAB.z]});
  for(const lx of [-4,0,4])for(const lz of [-1.4,1.4])objs.push({f:box([HAB.x+lx,0,HAB.z+lz],[.25,HAB.cy-HAB.r+.2,.25],DARKP),ctr:[HAB.x+lx,.3,HAB.z+lz]});
  // airlock + door
  const al=box([HAB.x+HAB.len/2+1,0.2,HAB.z],[2,3.4,2.4],[220,224,228]);
  al.push(mkFace([[HAB.x+HAB.len/2+.6,.6,HAB.z-1.22],[HAB.x+HAB.len/2+1.4,.6,HAB.z-1.22],[HAB.x+HAB.len/2+1.4,2.6,HAB.z-1.22],[HAB.x+HAB.len/2+.6,2.6,HAB.z-1.22]],ORANGE,{decal:true}));
  objs.push({f:al,ctr:[HAB.x+HAB.len/2+1,1.5,HAB.z]});
  // shelter mound (regolith over a buried module) + entry
  objs.push({f:dome([SHEL.x,0,SHEL.z],5.8,3.4,4.8,REG,20,5,7),ctr:[SHEL.x,1.4,SHEL.z],shelter:true});
  const en=box([SHEL.x+1,0,SHEL.z-5.2],[2,2.1,2.2],[200,200,204]);
  en.push(mkFace([[SHEL.x+.45,.2,SHEL.z-6.32],[SHEL.x+1.55,.2,SHEL.z-6.32],[SHEL.x+1.55,1.8,SHEL.z-6.32],[SHEL.x+.45,1.8,SHEL.z-6.32]],WIN,{emis:true,decal:true}));
  glows.push([SHEL.x+1,1,SHEL.z-6.6]);
  objs.push({f:en,ctr:[SHEL.x+1,1,SHEL.z-5.2]});
  // vertical solar arrays (real: polar arrays stand tall and turn to follow the low Sun)
  for(const [mx,mz] of MASTS){
    objs.push({f:box([mx,0,mz],[.55,13,.55],[190,192,198]),ctr:[mx,6,mz]});
    const pc=[mx+SUN[0]*.5,6.2,mz+SUN[2]*.5];
    const pf=box(pc,[3.6,6.4,.18],DARKP,PANEL_YAW);
    // sun-facing side gets the blue cell colour
    pf.forEach(f=>{if(dot(f.n,norm([SUN[0],0,SUN[2]]))>.9)f.col=CELL});
    objs.push({f:pf,ctr:add(pc,[0,3.2,0])});
  }
  glows.push([MASTS[1][0],13.4,MASTS[1][1],'red']);
  // battery / power unit
  objs.push({f:box([-8,0,56],[3,1.6,2],[205,205,210],PANEL_YAW),ctr:[-8,.8,56]});
  // rover
  const rv=box([ROVER.x,.75,ROVER.z],[3.4,1.2,2],WHITE,ROVER.yaw);
  objs.push({f:rv,ctr:[ROVER.x,1.3,ROVER.z]});
  const cab=box([ROVER.x+.6*Math.cos(ROVER.yaw*D2R),1.95,ROVER.z-.6*Math.sin(ROVER.yaw*D2R)],[1.4,.8,1.7],[210,215,222],ROVER.yaw);
  objs.push({f:cab,ctr:[ROVER.x,2.3,ROVER.z]});
  for(const [wx,wz] of [[-1.2,-1.1],[1.2,-1.1],[-1.2,1.1],[1.2,1.1]]){const q=rotY(wx,wz,ROVER.yaw*D2R);objs.push({f:box([ROVER.x+q[0],0,ROVER.z+q[1]],[.7,.7,.4],[70,72,80],ROVER.yaw),ctr:[ROVER.x+q[0],.45,ROVER.z+q[1]]})}
  // comms dish pointing at Earth
  objs.push({f:box([4,0,50],[.3,4.2,.3],[190,192,198]),ctr:[4,2,50]});
  objs.push({f:disk([4,4.6,50],EARTH,1.5,12,[225,228,232]),ctr:[4,4.6,50]});
  // rocks
  const R=rng(11);
  for(let i=0;i<46;i++){const x=-70+R()*170,z=10+R()*170,s=.3+R()*R()*1.8;
    if(x>-26&&x<14&&z>26&&z<68)continue; if(Math.hypot(x-CRATER.x,z-CRATER.z)<CRATER.R*1.5)continue;
    objs.push({f:rock([x,0,z],s,R),ctr:[x,s*.3,z]})}
  return {objs,glows};
}
const SCENE=buildScene();
const R2=rng(5), CRATERLETS=[];for(let i=0;i<55;i++){const x=-80+R2()*200,z=8+R2()*230,r=.8+R2()*R2()*7;if(Math.hypot(x-CRATER.x,z-CRATER.z)<CRATER.R*1.4)continue;if(x>-24&&x<14&&z>26&&z<66)continue;CRATERLETS.push([x,z,r])}
const R3=rng(9), STARS=[];for(let i=0;i<220;i++)STARS.push([-100+R3()*200, .5+Math.pow(R3(),1.6)*70, .5+R3()*1.4, .3+R3()*.7]);
const mtnFar=az=>1.3+.75*Math.sin(az*.09+1)+.5*Math.sin(az*.23+2)+.28*Math.sin(az*.61+.5)+.15*Math.sin(az*1.7);
const mtnNear=az=>.55+.35*Math.sin(az*.13+4)+.25*Math.sin(az*.41+1)+.12*Math.sin(az*1.3+2);

const FILL=norm([-0.35,0.55,-0.75]); // stylised fill light (game art choice, not physics)
function shadeCol(f,n,L,sunUp,nightAmb){
  const lam=(sunUp&&!f.noSun)?Math.max(0,dot(n,L)):0, es=Math.max(0,dot(n,EARTH)), up=Math.max(0,n[1]), fl=Math.max(0,dot(n,FILL));
  const a=sunUp?0.30:nightAmb, fk=sunUp?0.36:0.14;
  return [f.col[0]*(a+.05*up+.06*es+fk*fl+1.1*lam), f.col[1]*(a+.05*up+.07*es+fk*fl+1.0*lam), f.col[2]*(a*1.15+.06*up+.12*es+fk*fl*1.05+.82*lam)];
}
const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;

function drawScene(ctx, st, px){
  const cam=camFrom(VIEWS[st.view]), sunUp=st.light==='sun', L=sunUp?SUN:SUN_DOWN;
  const hz=projDir(cam,dirAE(cam.v.yaw,0))[1];
  // sky
  const g=ctx.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#03050c');g.addColorStop(.7,'#08102a');g.addColorStop(1,sunUp?'#132550':'#0c1636');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,hz+2);
  // stars
  for(const [az,el,sz,b] of STARS){const s=projDir(cam,dirAE(az,el));if(!s||s[1]>hz-4)continue;ctx.fillStyle=`rgba(230,240,255,${(sunUp?.45:.9)*b})`;
    if(px){ctx.fillRect(Math.round(s[0]/4)*4,Math.round(s[1]/4)*4,sz>1.5?8:4,4)}else{ctx.beginPath();ctx.arc(s[0],s[1],sz,0,7);ctx.fill()}}
  // sun
  const sp=projDir(cam,SUN);
  if(sunUp&&sp){const gl=ctx.createRadialGradient(sp[0],sp[1],0,sp[0],sp[1],230);gl.addColorStop(0,'rgba(255,240,200,.55)');gl.addColorStop(.25,'rgba(255,214,150,.18)');gl.addColorStop(1,'rgba(255,200,120,0)');
    ctx.fillStyle=gl;ctx.fillRect(sp[0]-240,sp[1]-240,480,480);
    const st2=ctx.createLinearGradient(sp[0]-420,0,sp[0]+420,0);st2.addColorStop(0,'rgba(255,230,180,0)');st2.addColorStop(.5,'rgba(255,236,190,.35)');st2.addColorStop(1,'rgba(255,230,180,0)');
    ctx.fillStyle=st2;ctx.fillRect(sp[0]-420,sp[1]-2,840,4);
    ctx.fillStyle='#fffbe9';ctx.beginPath();ctx.arc(sp[0],sp[1],17,0,7);ctx.fill()}
  // earth (crescent: Sun and Earth sit in a similar part of the sky, so most of Earth's day side faces away)
  const ep=projDir(cam,EARTH);
  if(ep){const r=17;ctx.save();ctx.beginPath();ctx.arc(ep[0],ep[1],r,0,7);ctx.clip();
    ctx.fillStyle='#16304f';ctx.fillRect(ep[0]-r,ep[1]-r,2*r,2*r);
    const toS=sp?norm([sp[0]-ep[0],sp[1]-ep[1],0]):[-1,0,0];
    ctx.fillStyle='#4f8fe0';ctx.beginPath();ctx.arc(ep[0],ep[1],r,0,7);ctx.fill();
    ctx.fillStyle='#e9f3ff';ctx.beginPath();ctx.ellipse(ep[0]+toS[0]*r*.5,ep[1]-r*.3,r*.5,r*.18,.3,0,7);ctx.fill();
    ctx.fillStyle='#3a9a5c';ctx.beginPath();ctx.ellipse(ep[0]+toS[0]*r*.55,ep[1]+r*.25,r*.3,r*.35,0,0,7);ctx.fill();
    ctx.fillStyle='rgba(12,24,48,.93)';ctx.beginPath();ctx.arc(ep[0]-toS[0]*r*.62,ep[1]-toS[1]*r*.62,r*1.02,0,7);ctx.fill();ctx.restore();
    const eg=ctx.createRadialGradient(ep[0],ep[1],r,ep[0],ep[1],r*2.4);eg.addColorStop(0,'rgba(120,180,255,.25)');eg.addColorStop(1,'rgba(120,180,255,0)');ctx.fillStyle=eg;ctx.beginPath();ctx.arc(ep[0],ep[1],r*2.4,0,7);ctx.fill()}
  // mountains
  const cp=Math.cos(cam.v.pitch*D2R);
  for(const [fn,col,lit] of [[mtnFar,sunUp?'#4a4752':'#15151d','#d9c9a8'],[mtnNear,sunUp?'#2d2c35':'#0e0e15',null]]){
    ctx.beginPath();ctx.moveTo(0,hz+1);const pts=[];
    for(let x=0;x<=W;x+=px?4:3){const az=cam.v.yaw+Math.atan((x-W/2)/cam.F*cp)/D2R;const s=projDir(cam,dirAE(az,fn(az)));pts.push([x,s[1]]);ctx.lineTo(x,s[1])}
    ctx.lineTo(W,hz+1);ctx.closePath();ctx.fillStyle=col;ctx.fill();
    if(sunUp&&fn===mtnFar){ctx.save();ctx.clip();const mg=ctx.createLinearGradient(sp?sp[0]:0,0,(sp?sp[0]:0)+700,0);mg.addColorStop(0,'rgba(255,226,170,.28)');mg.addColorStop(1,'rgba(255,226,170,0)');ctx.fillStyle=mg;ctx.fillRect(0,0,W,hz+2);ctx.restore()}
    if(!sunUp&&lit){ctx.strokeStyle=lit;ctx.lineWidth=px?4:2;ctx.globalAlpha=.55;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.globalAlpha=1}
  }
  // ground
  const gg=ctx.createLinearGradient(0,hz,0,H);
  if(sunUp){gg.addColorStop(0,'#9a959d');gg.addColorStop(.3,'#76727b');gg.addColorStop(1,'#56535c')}else{gg.addColorStop(0,'#2c2c38');gg.addColorStop(1,'#1c1c26')}
  ctx.fillStyle=gg;ctx.fillRect(0,hz,W,H-hz);
  // craterlets
  const Lh=norm([L[0],0,L[2]]);
  const cl=CRATERLETS.map(c=>({c,d:toCam(cam,[c[0],0,c[1]])[2]})).filter(o=>o.d>1).sort((a,b)=>b.d-a.d);
  const circ=(x,z,r,k=16)=>{const p=[];for(let i=0;i<k;i++){const a=i/k*2*Math.PI;p.push([x+Math.cos(a)*r,0,z+Math.sin(a)*r])}return p};
  for(const {c:[x,z,r]} of cl){
    if(pathWorld(ctx,cam,circ(x,z,r*1.08))){ctx.fillStyle=sunUp?'rgba(170,165,170,.35)':'rgba(60,60,75,.4)';ctx.fill()}
    if(pathWorld(ctx,cam,circ(x+Lh[0]*r*.3,z+Lh[2]*r*.3,r*.86))){ctx.fillStyle=sunUp?'rgba(20,20,30,.55)':'rgba(5,5,10,.5)';ctx.fill()}}
  // rover tracks
  ctx.strokeStyle=sunUp?'rgba(200,198,205,.35)':'rgba(120,120,140,.25)';ctx.lineWidth=px?4:1.6;

    if((p=P(SH.x-1500,SH.z+SH.R*.8,0)))pill(p[0],p[1],'SHACKLETON CRATER','21 km wide · 4 km deep · floor never sunlit',24);

    if((p=P(PSRS[1][0]+200,PSRS[1][1],0)))pill(p[0]+40,p[1],'DARK CRATERS · ice?','permanently shadowed · 1-2 km',-34);
    if((p=projPt(cam,[-4,3,46]))){ctx.strokeStyle='#5ee0e8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p[0],p[1],16,0,7);ctx.stroke();const gg=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],34);gg.addColorStop(0,'rgba(94,224,232,.35)');gg.addColorStop(1,'rgba(94,224,232,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(p[0],p[1],34,0,7);ctx.fill();pill(p[0],p[1]-16,'YOUR BASE','about 50 m across · to scale',70)}
  }else{
    if((p=P(1700,2550,0)))pill(p[0],p[1],'SHACKLETON’S RIM','the crater drops 4 km just beyond',40);
    if((p=P(PSRS[0][0],PSRS[0][1],0)))pill(p[0],p[1],'DARK CRATER · ice?','~1 km away',30);
    if((p=projPt(cam,[-2,7,40])))pill(p[0],p[1],'YOUR BASE','about 50 m across',150);
  }
  // off-screen pointers
  ctx.font='800 13px Nunito,system-ui';const chip=(x,y,t,c)=>{const w=ctx.measureText(t).width+20;ctx.fillStyle='rgba(6,26,36,.84)';ctx.beginPath();ctx.roundRect(x,y,w,26,13);ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle=c;ctx.fillText(t,x+10,y+17.5)};
  chip(14,hz-60>40?hz-60:40,'← South Pole: on Shackleton’s rim, ~10 km','#9ff6ff');
  chip(14,H-40,baseLit?'☀ Sun: very low, behind you':'☀ Sun: hidden behind far hills',baseLit?'#ffc24a':'#9aa8ff');
}

const QA=/*QA*/false;
const app=document.getElementById('app');
function mount(host,st){const fr=document.createElement('div');fr.className='frame';const cv=document.createElement('canvas');fr.appendChild(cv);host.appendChild(fr);
  const w=host.clientWidth||728,dpr=Math.min(2,window.devicePixelRatio||1)*Math.max(.6,w/1280);cv.width=Math.round(1280*dpr);cv.height=Math.round(720*dpr);const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);render(c,st)}
if(QA){app.className='qa';for(const frame of ['site','ground'])for(const light of ['sun','dark']){const h=document.createElement('h3');h.textContent=frame+' · '+light;app.appendChild(h);mount(app,{frame,light})}}
else{const st={frame:'site',light:'sun'};
  app.innerHTML=`<div class="bar"><div class="seg" data-k="frame">${Object.entries(FRAMES).map(([k,f])=>`<button data-v="${k}">${f.name}</button>`).join('')}</div><div class="seg" data-k="light"><button data-v="sun">Day 2 · Sunlight</button><button data-v="dark">Day 5 · Long shadow</button></div></div><div data-host></div><div class="desc">Real scale: the base is ~50 m across, Shackleton is 21 km wide. Shadows are traced over the terrain, so lit ridge vs dark craters comes out of the model, not hand painting. Layout read off the elevation map you shared; distances are estimates.</div>`;
  app.querySelectorAll('.seg').forEach(sg=>sg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st[sg.dataset.k]=b.dataset.v;go()}));
  function go(){app.querySelectorAll('.seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',st[sg.dataset.k]===b.dataset.v)));const h=app.querySelector('[data-host]');h.innerHTML='';mount(h,st)}
  go();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(go)}
</script>
</body>
