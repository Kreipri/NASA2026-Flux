<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 var(--font-sans,system-ui);color:var(--foreground,#e7eaf0)}
.tools{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.buttons{display:flex;gap:5px;flex-wrap:wrap}
button,select{font:inherit;border:1px solid var(--border,#536078);border-radius:8px;background:var(--background,#171d2e);color:inherit;min-height:40px;padding:8px 11px;cursor:pointer}button[aria-pressed="true"]{background:var(--secondary,#33415c);box-shadow:inset 0 -2px #21dbe3}button:focus-visible,select:focus-visible{outline:3px solid var(--ring,#21dbe3);outline-offset:2px}
.canvas{background:#202c47;padding:16px;border-radius:var(--radius,12px);overflow:hidden}.canvas.light{background:#e4e7ed}.canvas img{width:100%;height:auto;display:block}
.scene{width:100%;aspect-ratio:16/9;display:block;border:0;border-radius:var(--radius,12px)}[hidden]{display:none!important}
.refs{display:flex;gap:20px;justify-content:center;align-items:end;background:#e9ebf1;border-radius:var(--radius,12px);padding:12px 16px;margin-top:12px;color:#27304c}.refs figure{margin:0;text-align:center}.refs img{height:88px;width:auto;display:block;margin:0 auto 6px}.refs figcaption{font-size:11px}.refs figure:last-child img{height:102px}
.note{margin:10px 0 0;color:var(--muted-foreground,#99a6bc);font-size:12px}.weight{display:flex;align-items:center;gap:6px;font-size:12px}
@media(max-width:450px){button{padding:8px}.canvas{padding:8px}.refs{gap:14px;padding:12px 8px}.refs img{height:70px}.refs figure:last-child img{height:82px}}
</style></head><body>

  :root{ --mut:var(--muted-foreground,#aab0cf); --fg:var(--foreground,#eef0fb); --amber:#ffb547; --amber-deep:#2a1a06; --teal:#5fd0c8; --line:#3a3f6e; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--background,#0a0e22);color:var(--fg);font-family:Lexend,system-ui,sans-serif}
  main{max-width:1120px;margin:0 auto;padding:4px 0 16px}
  section{margin:0 0 30px}
  .label{display:flex;gap:10px;align-items:baseline;margin:0 0 8px;flex-wrap:wrap}
  .label b{font-size:16px;font-weight:600}
  .label span{color:var(--mut);font-size:13px}

  .screen{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;container-type:inline-size;background:#0d1433;box-shadow:0 0 0 1px var(--line)}
  .screen &gt; svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .ui{position:absolute;inset:0}

  /* chrome: sized for kids */
  .skip{position:absolute;top:2.2cqw;right:2.4cqw;font:600 1.6cqw Fredoka;color:#f1ecff;background:rgba(14,12,40,.6);border:1px solid rgba(230,220,255,.35);border-radius:99px;padding:.6cqw 1.5cqw}
  .cap{position:absolute;left:2.6cqw;right:2.6cqw;bottom:2.4cqw;display:flex;gap:1.8cqw;align-items:center;background:rgba(14,12,40,.88);border:1px solid rgba(230,220,255,.2);border-radius:1.8cqw;padding:1.6cqw 2cqw}
  .cap .body{flex:1;min-width:0}
  .cap .t{font:500 2.6cqw/1.28 Fredoka;color:#fbf9ff;margin:0}
  .who{display:inline-block;font:600 1.3cqw Lexend;letter-spacing:.12em;color:#0b2030;background:var(--teal);border-radius:.6cqw;padding:.25cqw .9cqw;margin-bottom:.6cqw}
  .who.mc{background:#ffcf6e;color:#2a1a06}
  .badges{display:flex;gap:.8cqw;margin-top:.9cqw;flex-wrap:wrap}
  .badge{font:600 1.4cqw Lexend;color:#c8f6f1;background:rgba(95,208,200,.16);border:1px solid rgba(95,208,200,.55);border-radius:99px;padding:.3cqw 1.1cqw;cursor:help;outline:none}
  .badge:hover,.badge:focus-visible,.badge.on{background:rgba(95,208,200,.32)}
  .next{flex:none;font:600 2.2cqw Fredoka;color:var(--amber-deep);background:var(--amber);border-radius:99px;padding:1.2cqw 2.6cqw;box-shadow:0 .4cqw 0 #b9731d,0 0 2cqw rgba(255,181,71,.4)}
  .next.big{font-size:2.6cqw;padding:1.3cqw 3.4cqw}
  .face{flex:none;width:8cqw;height:8cqw;border-radius:50%;background:#1d2a55;border:.25cqw solid var(--teal);overflow:hidden;display:grid;place-items:center}
  .face{position:relative}
  .face img{position:absolute;left:50%;top:0;width:98%;height:auto;transform:translate(-50%,9%)}
  .face.mc{border-color:#ffcf6e;background:#2a2350}
  .face.mc svg{width:56%;height:56%}
  .note{position:absolute;max-width:28cqw;background:#fbf9ff;color:#251b52;border-radius:1.3cqw;padding:1.2cqw 1.5cqw;font:500 1.8cqw/1.32 Fredoka;box-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.35)}
  .note .q{display:block;font-weight:700;color:#3a1f6e}
  .note .badge{color:#0f5a55;background:rgba(95,208,200,.25);border-color:#5fd0c8;font-size:1.2cqw;display:inline-block;margin-top:.6cqw}
  .note.down::after{content:&quot;&quot;;position:absolute;left:4cqw;bottom:-.9cqw;width:1.8cqw;height:1.8cqw;background:#fbf9ff;transform:rotate(45deg)}

  /* tappable words + source cards */
  .word{border-bottom:.22cqw dotted #7ff0e6;cursor:help;outline:none;border-radius:.2cqw}
  .word:hover,.word:focus-visible,.word.on{background:rgba(127,240,230,.2)}
  .tip{position:absolute;z-index:5;max-width:40cqw;background:#fbf9ff;color:#251b52;border-radius:1.3cqw;padding:1.2cqw 1.5cqw;box-shadow:0 .6cqw 2cqw rgba(0,0,0,.45);font:500 1.8cqw/1.35 Fredoka;pointer-events:none;opacity:0;transform:translateY(.4cqw);transition:opacity .15s,transform .15s}

  .tip.above::after{bottom:-.6cqw}.tip.below::after{top:-.6cqw}

  .tip b{display:block;font-weight:700;color:#3a1f6e;font-size:1.9cqw}
  .tip .hd{font:600 1.2cqw Lexend;letter-spacing:.1em;color:#0f7a72;margin-bottom:.5cqw}

  .tip .src div{margin-top:.6cqw}
  .tip .src small{display:block;font:400 1.15cqw/1.35 Lexend;color:#5a5480}

  .ttl{position:absolute;left:5cqw;top:4.6cqw;margin:0;font:700 9.4cqw/.86 Fredoka;letter-spacing:.01em;
    background:linear-gradient(180deg,#fff1c9 8%,#ffc35c 50%,#ff8a6a 92%);-webkit-background-clip:text;background-clip:text;color:transparent;

  /* P2 challenge cards */
  .hard{position:absolute;left:0;right:0;top:9cqw;display:flex;justify-content:center;gap:3cqw}
  .hard .c{width:20cqw;background:rgba(14,12,40,.78);border:1px solid rgba(230,220,255,.28);border-radius:2cqw;padding:1.4cqw 1.2cqw 1.6cqw;text-align:center;font:600 2.1cqw/1.2 Fredoka;color:#fbf9ff;opacity:0;animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
  .hard .c:nth-child(2){animation-delay:.5s}.hard .c:nth-child(3){animation-delay:1s}
  .hard svg{width:12cqw;height:12cqw;display:block;margin:0 auto .8cqw}
  /* overlays */
  .cal{position:absolute;width:15cqw;border-radius:1.2cqw;overflow:hidden;background:#f6f3ff;box-shadow:0 .6cqw 1.4cqw rgba(0,0,0,.35);text-align:center;font-family:Fredoka;color:#2a1d5c}
  .cal .bar{background:#ff7a6b;color:#fff;font:600 1.3cqw Lexend;letter-spacing:.1em;padding:.45cqw}

  .cal .n span:last-child{opacity:1}
  .cal .lb{font:500 1.5cqw Fredoka;padding:0 .4cqw .8cqw}

  .cal.flip3 .n span:nth-child(2){animation-delay:1.5s}.cal.flip3 .n span:nth-child(3){animation-delay:3s}
  @keyframes f3{0%{opacity:0;transform:translateY(30%)}3%{opacity:1;transform:none}30%{opacity:1;transform:none}33.3%,100%{opacity:0;transform:translateY(-30%)}}
  .batt{position:absolute;display:flex;align-items:center;gap:1.2cqw;font:600 2cqw Fredoka;color:#fff6e0;background:rgba(14,12,40,.65);border:1px solid rgba(255,207,110,.45);border-radius:99px;padding:.8cqw 1.6cqw}

  /* motion */
  .twinkle{animation:tw 3.5s ease-in-out infinite}
  .beacon{animation:beacon 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .pop{opacity:0;animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards;transform-box:fill-box;transform-origin:center bottom}
  .fadein{opacity:0;animation:fade 1.2s ease forwards}
  .blink{animation:blink 1.1s steps(2) infinite}
  .zoom{animation:zoom 9s ease-out forwards}
  .drop{transform-box:fill-box;transform-origin:center bottom;animation:drop 3.5s ease-in forwards}
  .swing{transform-box:view-box;transform-origin:780px 592px;animation:swing 9s linear infinite}
  .orbit{transform-box:view-box;transform:rotate(-90deg);animation:orbit 9s linear infinite}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes beacon{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:.95;transform:scale(1.1)}}
  @keyframes pop{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
  @keyframes fade{to{opacity:1}}
  @keyframes blink{0%{opacity:1}50%{opacity:.2}}
  @keyframes zoom{from{transform:scale(1)}to{transform:scale(1.18)}}
  @keyframes drop{from{transform:scaleY(1)}to{transform:scaleY(.12)}}

  @keyframes orbit{0%{transform:rotate(-90deg)}72%{transform:rotate(90deg)}100%{transform:rotate(270deg)}}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important}
    .pop,.fadein,.hard .c{opacity:1}
  }
